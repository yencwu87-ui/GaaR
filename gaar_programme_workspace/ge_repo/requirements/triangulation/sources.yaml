schema_version: wb100.source-registry.1
as_of: '2026-09-14'
policy:
  canonical_requiredness_gate: >-
    Only effective binding/supervisory sources can support canonical requiredness. Proposed,
    consultation, voluntary and industry sources can generate future candidates, corroboration,
    challenge questions or assurance context but cannot promote themselves into a live element.
  temporal_rule: >-
    A source is evaluated using publication, consultation, effective and supersession dates.
    Never use a later proposed source to overwrite an earlier effective requirement for a historical
    assessment unless the assessment's as_of date is within the proposal's effective window.
  external_backtest_rule: >-
    Web findings are challenge evidence. They must be stored with retrieval timestamp, source URL,
    quoted locator/excerpt, authority classification and content hash. They cannot change the governed
    requirement file automatically.
