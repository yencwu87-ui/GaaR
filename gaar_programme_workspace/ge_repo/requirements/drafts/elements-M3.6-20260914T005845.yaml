controls:
  M3.6:
    framework: MAS
    title: Evaluation, testing & independent validation
    instrument_provenance: file:Final_Consultation_Paper_on_Guidelines_on_AI_Risk_Management_ForRelease.txt
    instrument_verified: true
    candidates_offered: 18
    selected:
    - index: 3
      sentence: Each AI use case, system or model should be evaluated and tested to meet an appropriate
        level of reliability and safety based on the assessed risk materiality before deployment.
    - index: 5
      sentence: 'Testing Approaches: Employ relevant testing methods, such as out -of-sample or out -of-time
        testing, sensitivity analysis, stability analysis across different data distributions or time
        periods, sub-population analysis, stress testing (including edge cases and adversarial testing
        where appropriate), error analysis, and benchmarking against alternatives.'
    - index: 7
      sentence: Proposed Guidelines on AI Risk Management | 24 Technology & Cybersecurity Risks 4.16 An
        FI should ensure that the AI system is secure, well-governed, and supported by appropriate controls
        to manage technology and cybersecurity risks .
    - index: 11
      sentence: Proposed Guidelines on AI Risk Management | 25 formal independent validation before deployment.
    - index: 12
      sentence: Such validations should be conducted by competent personnel or functions possessing the
        necessary expertise and objectivity, and who are independent from the development and deployment
        teams.
    - index: 13
      sentence: 'The validation process should provide effective challenge to developers and should cover
        areas such as: a. conceptual soundness of the design; b. suitability and quality of data inputs;
        c. integrity of the implementation; d. evaluation measures, performance thresholds, testing approaches
        and results; e. explainability analysis and fairness assessments; and f. assumptions, limitations
        and mitigants. 4.20 For AI use cases, systems or models not assessed as having high risk materiality,
        other forms of documented review (such as peer reviews by qualified individuals that were not
        involved in development or deployment 29) on key aspects of the development and deployment processes
        may be undertaken. 4.21 Review findings, including any identified limitations, necessary remediation
        actions, or conditions for use, should be reported by reviewers to the relevant approval body.'
    - index: 15
      sentence: 'Documentation: Maintain clear records of monitoring activities, results, identified issues
        or incidents, and subsequent remediation actions taken for auditability and ongoing risk management.'
    - index: 16
      sentence: 'Training and Awareness : Equip persons responsible for monitoring with appropriate training
        to support effective monitoring and incident management ; and equip users of deployed AI with
        the necessary training and awareness to report unintended behaviour of deployed AI. 4.24 An FI
        should periodically review aggregate risks across all AI use cases, systems and models, and, where
        necessary, conduct more detailed reviews or re-validations of specific AI in the portfolio.'
