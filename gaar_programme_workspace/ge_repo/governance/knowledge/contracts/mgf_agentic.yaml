    text: A recertification with revocation evidence at the target system, not only the sign-off sheet.
  - failure_mode: F5
    text: An entitlement review of the credential itself, scoped to the mandate.
  - failure_mode: F6
    text: An aggregate or cumulative limit in the enforced configuration, with evidence of its operation.
  population_and_evidence_floor: 'Population: the enforced configuration plus all grants and all boundary
    events in the period. Evidence floor: no enforced configuration export, or zero boundary events with
    no enforcement test, makes the operating result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: MGF Agentic
  control_id: D1.6
  title: Third-party / multi-agent dependency review
  requirement: Bound risk inherited from external / peer agents
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: External agents, third-party agentic services and peer agents that can affect the use case are
      identified.
    scope: model
    applies_when: null
    locator: controls.D1.6.elements[0]
  - id: e2
    text: Risks inherited from external or peer agents are assessed, including opacity, failure propagation
      and permission dependencies.
    scope: model
    applies_when: null
    locator: controls.D1.6.elements[1]
  - id: e3
    text: Interfaces, shared data, delegated permissions and hand-offs between agents are explicitly bounded.
    scope: model
    applies_when: null
    locator: controls.D1.6.elements[2]
  - id: e4
    text: Where external components cannot provide sufficient transparency or control, compensating containment,
      oversight or escalation is defined.
    scope: model
    applies_when: null
    locator: controls.D1.6.elements[3]
  boundary:
    none: no third-party assessment for AI providers, or providers in production with no assessment.
    partial: onboarding diligence occurred but contractual rights, sub-processor scope or ongoing oversight
      is not evidenced.
    full: assessments preceded use, required clauses are present in executed contracts, and ongoing oversight
      operated with findings dispositioned.
  owner: AI Risk (2nd line) / Model Owner
  expected_evidence:
  - compensating controls
  - data/permission flow
  - delegation rules
  - dependency inventory
  - dependency risk assessment
  - escalation / exception record
  - interface contract
  - third-party agent register
  - vendor assurance
  linked_play:
  - Play 1, 7
  test_of_design:
  - id: D1
    text: Obtain the third-party requirements covering Third-party / multi-agent dependency review — the
      due-diligence scope, the contractual clauses required and the approval route before onboarding.
  - id: D2
    text: Confirm the due diligence covers what the provider does with the institution's data, the provider's
      own model change practice, and its notification obligations on material change or incident.
  - id: D3
    text: 'Confirm contractual rights: audit or assurance report access, notification periods, exit and
      transition, and liability for model behaviour.'
  - id: D4
    text: Confirm the ongoing obligation — reassessment cadence, performance monitoring and the trigger
      for re-approval.
  - id: D5
    text: Confirm the treatment of sub-processors and of models embedded in a purchased product, where
      the AI is not the thing being bought.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when diligence is defined but
      ongoing obligations or embedded-AI treatment is absent. INADEQUATE when no pre-onboarding assessment
      is required. NOT TESTABLE when the requirements are not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of AI-relevant third parties in the period from procurement or vendor-management
      data, including products with embedded AI, not only AI vendors.
  - id: O2
    text: Sample and verify a completed assessment dated before contract signature or before first production
      use.
  - id: O3
    text: Verify the required clauses are present in the executed contract, read from the contract rather
      than the checklist.
  - id: O4
    text: Verify ongoing obligations operated — reassessment at cadence, assurance reports obtained and
      reviewed with findings dispositioned, and provider change notifications acted on.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when assessments preceded use, clauses are present and ongoing
      obligations ran. PARTIALLY EFFECTIVE when onboarding was controlled but ongoing oversight is unevidenced.
      INEFFECTIVE when material providers were onboarded unassessed. NOT TESTABLE when the vendor population
      cannot be established.'
  near_miss_failure_modes:
  - F1. The provider was assessed as a software vendor before the AI feature was enabled, and never reassessed
    when it was.
  - F2. The assessment is dated after contract signature, so it recorded a decision already taken.
  - F3. The contract references an assurance report that was never obtained, or one that excludes the
    AI component from scope.
  - F4. Sub-processors are named in the provider's terms but were never assessed.
  - F5. Provider change notifications arrive but there is no route by which they reach the control owner.
  - F6. The provider's own model changes silently under a continuously updated service, with no version
    pinning and no notification right.
  resolutions:
  - failure_mode: F1
    text: A reassessment triggered by the AI feature being enabled.
  - failure_mode: F2
    text: An assessment record dated before signature, or an approved exception.
  - failure_mode: F3
    text: The assurance report itself, with its scope section showing the AI component in scope.
  - failure_mode: F4
    text: A sub-processor list with assessment status.
  - failure_mode: F5
    text: A routing record showing a provider notification reaching and being actioned by the control
      owner.
  - failure_mode: F6
    text: A version-pinning or change-notification clause and evidence of it operating.
  population_and_evidence_floor: 'Population: all AI-relevant third parties and AI-embedded products in
    use during the period, from procurement or vendor-management data. Evidence floor: a vendor list supplied
    by the assessed team without procurement reconciliation makes the completeness result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: MGF Agentic
  control_id: D2.1
  title: Responsibility allocation across value chain
  requirement: Keep a named owner answerable for agent actions
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Responsibilities for agent design, deployment, operation, oversight and escalation are explicitly
      allocated.
    scope: model
    applies_when: null
    locator: controls.D2.1.elements[0]
  - id: e2
    text: A named accountable owner remains answerable for consequential agent actions and decisions.
    scope: model
    applies_when: null
    locator: controls.D2.1.elements[1]
  - id: e3
    text: Responsibilities across internal teams and relevant external parties are reconciled so no material
      responsibility falls between organisational boundaries.
    scope: model
    applies_when: null
    locator: controls.D2.1.elements[2]
  boundary:
    none: no approved mandate, or a mandate that names no accountable body and no reserved decisions.
    partial: an approved mandate exists but one or more of decision rights, quorum, cadence or escalation
      thresholds is absent, or the body exists but material decisions are not traceable to it.
    full: mandate, reserved decision rights and reporting are approved and current, and material decisions
      in the period are attributable to the body with actions tracked.
  owner: AI Risk Cttee / AI Risk (2nd line)
  expected_evidence:
  - RACI / responsibility matrix
  - accountability assignment
  - named owner record
  - operating model
  - third-party responsibility clauses
  - value-chain responsibility map
  linked_play:
  - Play 1, All
  test_of_design:
  - id: D1
    text: Obtain the approved terms of reference, mandate or charter covering Responsibility allocation
      across value chain, with its approval record and version history.
  - id: D2
    text: Confirm the mandate names the accountable role or body, its membership and quorum, and the decisions
      reserved to it rather than delegated to a model, a vendor or the delivery team.
  - id: D3
    text: Confirm reporting inputs, cadence, materiality thresholds for escalation and evidence-retention
      responsibilities are stated, not implied.
  - id: D4
    text: Confirm the mandate is current — reviewed within its stated cycle, and updated for any material
      change in AI scope since approval.
  - id: s5
    text: 'Design verdict: ADEQUATE only when D1-D3 all hold. PARTIALLY ADEQUATE when D1 holds and one
      of D2-D3 is incomplete. INADEQUATE when decision rights or accountability cannot be located. NOT
      TESTABLE when the authoritative mandate is not produced — absence of the artefact from the evidence
      pack is not a design failure until its absence is confirmed by the owner.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all meetings, decisions or approvals falling under the mandate in the
      review period. Establish the population from the calendar or register, not from the minutes supplied.'
  - id: O2
    text: Sample at least three meetings including every meeting at which a high-materiality matter was
      decided. Verify attendance against quorum.
  - id: O3
    text: 'Reperform: trace each sampled material AI matter to a recorded decision, a named decision-maker
      and a dated action, then trace open actions to closure or formal acceptance.'
  - id: O4
    text: Inspect any period in which the cadence was missed and the disposition of that gap.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when the body met at cadence, decided the material matters in
      scope, and actions were tracked. PARTIALLY EFFECTIVE when it operated but decisions or follow-up
      are incomplete. INEFFECTIVE when material matters bypassed the body. NOT TESTABLE when the population
      cannot be established.'
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than
    deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification
    date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not
    record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings
    without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved
    before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance
      naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period,
    established from the governance calendar or decision register. Evidence floor: fewer than 3 meetings
    or fewer than 1 material decision available to inspect makes the operating result NOT TESTABLE rather
    than a PASS.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: MGF Agentic
  control_id: D2.2
  title: Adaptive governance
  requirement: Keep governance current with capability change
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Changes in agent capability, autonomy, tools, data access, use context or external dependencies
      are identified as governance signals.
    scope: model
    applies_when: null
    locator: controls.D2.2.elements[0]
  - id: e2
    text: Defined change signals trigger governance reassessment, approval or control updates.
    scope: model
    applies_when: null
    locator: controls.D2.2.elements[1]
  - id: e3
    text: Governance ownership and review cadence remain current as agent capabilities and risk evolve.
    scope: model
    applies_when: null
    locator: controls.D2.2.elements[2]
  boundary:
    none: no change control over the AI artefacts, or production changes with no record.
    partial: change records exist but approval timing, approver authority, artefact versioning or post-implementation
      verification is not evidenced.
    full: every deployment reconciles to a record approved in advance by an authorised, independent approver,
      with the artefact versions named and the deployed state verified.
  owner: AI Risk Cttee / AI Risk (2nd line)
  expected_evidence:
  - change monitoring record
  - change taxonomy
  - change thresholds
  - governance review cadence
  - reassessment workflow
  - updated approvals / decisions
  linked_play:
  - Play 8
  test_of_design:
  - id: D1
    text: Obtain the change or release procedure covering Adaptive governance — change classes, required
      approvals per class, testing gates and the record fields captured.
  - id: D2
    text: 'Confirm the record captures the AI-specific artefacts that change behaviour: model version,
      prompt or system-instruction version, tool or data-source configuration, and retrieval corpus where
      applicable.'
  - id: D3
    text: Confirm approval must precede implementation, and who may approve each class. Confirm the emergency
      route, its eligibility criteria and its retrospective approval window.
  - id: D4
    text: Confirm the rollback or reversion plan requirement and how it is validated.
  - id: D5
    text: Confirm post-implementation verification — that what is running is what was approved.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the procedure exists
      but omits AI-specific artefacts or post-implementation verification. INADEQUATE when approval is
      not required before implementation. NOT TESTABLE when the procedure is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population from the deployment source — the pipeline, release log or runtime history
      — not from the change register, so changes made without a record can be found.
  - id: O2
    text: Reconcile deployments to change records. Every deployment with no record is a finding.
  - id: O3
    text: Sample changes across classes including at least one emergency and one model or prompt version
      change. Compare approval timestamp to implementation timestamp.
  - id: O4
    text: Verify the approver was authorised for the class and is not the implementer.
  - id: O5
    text: Trace a sample to post-implementation verification, and any backed-out change to its rollback
      record.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when deployments reconcile to approved records, approvals precede
      implementation and verification occurred. PARTIALLY EFFECTIVE when records exist but timing, approver
      authority or verification is incomplete. INEFFECTIVE when unrecorded or unapproved production changes
      are found. NOT TESTABLE when the deployment population cannot be established independently.'
  near_miss_failure_modes:
  - F1. Approval timestamp is after the deployment timestamp — the record documents the change rather
    than authorising it.
  - F2. The approver is the implementer, or sits outside the approval matrix for that class.
  - F3. The emergency route carries a material share of all changes, with no incident reference behind
    them.
  - F4. The change names the service but not the model or prompt version, so the artefact that actually
    changed is invisible.
  - F5. A change freeze was in force and the change proceeded with no documented exemption.
  - F6. Privileged sessions used to implement are not recorded, or do not reconcile to the named implementer.
  - F7. No post-implementation verification, so a difference between the approved plan and the deployed
    state would never surface.
  resolutions:
  - failure_mode: F1
    text: A change record whose approval timestamp precedes deployment, or an approved retrospective acceptance
      naming the exposure.
  - failure_mode: F2
    text: An approval matrix and a record showing an approver drawn from it, distinct from the implementer.
  - failure_mode: F3
    text: An emergency change register with incident references and a rate that can be explained.
  - failure_mode: F4
    text: A change record field holding the model and prompt version, populated for a sampled change.
  - failure_mode: F5
    text: A freeze exemption approved at the level the freeze policy requires.
  - failure_mode: F6
    text: A privileged session record reconciling to the change and the named implementer.
  - failure_mode: F7
    text: A post-implementation verification record comparing running state to approved state.
  population_and_evidence_floor: 'Population: all production deployments in the period, established from
    the deployment pipeline or runtime history. Evidence floor: a population taken only from the change
    register cannot detect unrecorded change — report NOT TESTABLE for completeness in that case.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: MGF Agentic
  control_id: D2.3
  title: Human approval at significant checkpoints
  requirement: Hold the agent at the points that matter most
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Significant checkpoints and action boundaries requiring human approval are explicitly defined.
    scope: model
    applies_when: null
    locator: controls.D2.3.elements[0]
  - id: e2
    text: The agent cannot perform actions beyond those checkpoints without the required human approval.
    scope: model
    applies_when: null
    locator: controls.D2.3.elements[1]
  - id: e3
    text: Checkpoint design covers consequential actions such as sensitive data access, external communication
      or material transactions where applicable.
    scope: model
    applies_when: null
    locator: controls.D2.3.elements[2]
  - id: e4
    text: Human approvals are attributable to the approver and linked to the agent action being authorised.
    scope: model
    applies_when: null
    locator: controls.D2.3.elements[3]
  boundary:
    none: no defined human authority over the outcome, or oversight that cannot change anything.
    partial: oversight points are defined and operating but information sufficiency, timing or genuine
      disagreement is not evidenced.
    full: reviewers act before the action with sufficient information, a usable override, reasoned records,
      and a disagreement rate consistent with real review.
  owner: AI Risk Committee / Model Owner
  expected_evidence:
  - action classification
  - agent action trace
  - approval gate configuration
  - approval record
  - checkpoint mapping
  - checkpoint matrix
  - negative-path test
  - workflow design
  linked_play:
  - Play 4
  test_of_design:
  - id: D1
    text: Obtain the oversight design for Human approval at significant checkpoints — at which points
      a person acts, what they receive, and what authority they hold.
  - id: D2
    text: 'Confirm the design distinguishes deciding from reviewing: state whether the human decides,
      may veto, or is merely informed, and what happens if they do nothing.'
  - id: D3
    text: Confirm the information the reviewer receives is sufficient to disagree — inputs, confidence
      or uncertainty, and the basis of the recommendation.
  - id: D4
    text: Confirm the override route exists, is usable in the time available, and records a reason.
  - id: D5
    text: 'Confirm competence and capacity: who may act in the role, and whether the volume allows genuine
      review.'
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when a review point exists but
      authority or information sufficiency is undefined. INADEQUATE when no human authority to stop or
      change the outcome exists. NOT TESTABLE when the design is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of decisions or actions subject to oversight in the period.
  - id: O2
    text: Measure the override and rejection rate. A rate at or near zero across a large population is
      a finding to investigate, not evidence of quality.
  - id: O3
    text: Sample reviewed items and verify the reviewer had the stated information and recorded a decision
      with a reason.
  - id: O4
    text: 'Test timing: the review preceded the action it governs, and the time taken is consistent with
      genuine review rather than batch confirmation.'
  - id: O5
    text: Trace a sample of overrides to their effect on the system outcome.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when oversight occurred before the action, with reasoned decisions
      and a credible disagreement rate. PARTIALLY EFFECTIVE when review occurred but reasons or timing
      are unevidenced. INEFFECTIVE when oversight was nominal or post hoc. NOT TESTABLE when the decision
      population cannot be established.'
  near_miss_failure_modes:
  - F1. Approval rate is 100% across thousands of items, which evidences a click-through rather than a
    review.
  - F2. The reviewer sees only the recommendation, not the inputs or the uncertainty, so disagreement
    has no basis.
  - F3. The override exists but requires a path longer than the decision window, so it is never used.
  - F4. Review timestamps cluster in batches seconds apart, inconsistent with individual consideration.
  - F5. The human is accountable in the policy but the system proceeds automatically on no response.
  - F6. Overrides are recorded but the system took the original action anyway.
  resolutions:
  - failure_mode: F1
    text: The override and rejection rate with a distribution, plus an explanation for a near-zero rate.
  - failure_mode: F2
    text: A screenshot or specification of what the reviewer is shown, including uncertainty.
  - failure_mode: F3
    text: An override performed within the decision window, with timings.
  - failure_mode: F4
    text: Per-item review timestamps and durations.
  - failure_mode: F5
    text: A default-on-no-response rule that halts rather than proceeds, with evidence of it operating.
  - failure_mode: F6
    text: System evidence that an override changed the outcome.
  population_and_evidence_floor: 'Population: all decisions or actions subject to human oversight in the
    period. Evidence floor: fewer than 10 reviewed items, or no override population, makes the rate analysis
    NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
