    text: Alerts are routed to responsible roles with defined response expectations.
    scope: model
    applies_when: null
    locator: controls.D3.14.elements[2]
  - id: e4
    text: Alert handling, escalation and closure are traceable.
    scope: model
    applies_when: null
    locator: controls.D3.14.elements[3]
  boundary:
    none: no monitoring, or monitoring with no thresholds and no owner.
    partial: monitoring is configured and running but coverage, alert disposition or detector assurance
      is incomplete, or the metrics are proxies for the risk rather than the risk.
    full: approved metrics ran continuously, alerts were owned and dispositioned, and the detector is
      demonstrably capable of firing.
  owner: Model Owner / AI Risk (2nd line)
  expected_evidence:
  - alert case records
  - alert payload
  - alert rules
  - closure log
  - log monitoring configuration
  - on-call matrix
  - routing configuration
  - severity model
  linked_play:
  - Play 5
  test_of_design:
  - id: D1
    text: Obtain the monitoring design for Log monitoring & alerting — the metrics, their thresholds,
      the observation window and the alerting route.
  - id: D2
    text: Confirm the metrics correspond to the failure the control exists to catch, not only to availability
      or infrastructure health.
  - id: D3
    text: Confirm each alert has a named recipient, a required response time and a disposition record.
  - id: D4
    text: Confirm how the detector itself is validated — how anyone knows an alert would fire if the condition
      occurred.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D4 identifies a test route. PARTIALLY ADEQUATE
      when metrics and thresholds exist but ownership or detector assurance is absent. INADEQUATE when
      thresholds are undefined. NOT TESTABLE when the monitoring configuration is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the monitoring output for the full period, with coverage gaps identified — periods with
      no data are findings, not blanks.
  - id: O2
    text: Verify the configuration in force matches the approved design, read from the running configuration
      rather than from a document.
  - id: O3
    text: Sample alerts raised and trace each to an owner, a response within the stated time and a disposition.
  - id: O4
    text: Where no alert fired in the period, test the detector — a synthetic breach, a back-test against
      a known past event, or an equivalent.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when monitoring ran continuously against the approved thresholds
      and alerts were dispositioned. PARTIALLY EFFECTIVE when coverage gaps exist or alerts closed without
      disposition. INEFFECTIVE when monitoring was not operating or breaches were not acted on. NOT TESTABLE
      when monitoring output for the period is unavailable.'
  near_miss_failure_modes:
  - F1. No alert fired all period and this is presented as evidence of health, with nothing showing the
    detector works.
  - F2. Thresholds in the running configuration differ from the approved design, usually loosened after
    a noisy week.
  - F3. Alerts are routed to a shared channel with no named owner, and closure is by silence.
  - F4. Monitoring covers latency and uptime while the control is about model quality, drift or mandate
    breach.
  - F5. Coverage has gaps that coincide with the periods of highest change.
  - F6. Drift is monitored on inputs only, with no monitoring of the outcome the model drives.
  resolutions:
  - failure_mode: F1
    text: A detector test, synthetic breach or back-test against a known past event.
  - failure_mode: F2
    text: An export of the running configuration compared to the approved baseline, with any deviation
      approved.
  - failure_mode: F3
    text: An alert record naming a recipient, a response time and a disposition.
  - failure_mode: F4
    text: A metric definition tied to the control objective, with at least one period of output.
  - failure_mode: F5
    text: A continuous coverage statement with gaps explained and dispositioned.
  - failure_mode: F6
    text: Output-side monitoring covering the decisions or actions the system produced.
  population_and_evidence_floor: 'Population: the full monitoring period, plus all alerts raised. Evidence
    floor: no alerts in the period and no detector test means silence is uninformative — report NOT TESTABLE
    rather than PASS.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: MGF Agentic
  control_id: D3.15
  title: Incident review & periodic audit
  requirement: Assure ongoing fitness of the system
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Material incidents involving agent behaviour are reviewed for root cause, control failure and
      impact.
    scope: model
    applies_when: null
    locator: controls.D3.15.elements[0]
  - id: e2
    text: Periodic assurance or audit checks the continuing fitness of agent controls and behaviour after
      deployment.
    scope: model
    applies_when: null
    locator: controls.D3.15.elements[1]
  - id: e3
    text: Findings from incidents and audits feed into control, testing or deployment changes.
    scope: model
    applies_when: null
    locator: controls.D3.15.elements[2]
  boundary:
    none: no AI incident procedure, or no trigger and no containment path.
    partial: the procedure exists and events were handled, but timings, containment effectiveness or lessons-to-controls
      are not evidenced.
    full: incidents were detected and escalated within target, containment demonstrably took effect, and
      post-incident actions changed the controls they implicate.
  owner: Model Owner / AI Risk (2nd line)
  expected_evidence:
  - assurance report
  - finding register
  - incident review
  - periodic audit plan
  - retest/change record
  - root-cause analysis
  linked_play:
  - Play 5, 6
  test_of_design:
  - id: D1
    text: Obtain the incident or escalation procedure covering Incident review & periodic audit — what
      constitutes an AI incident, severity criteria, and the trigger for invoking it.
  - id: D2
    text: Confirm AI-specific incident types are named, not only availability and security — for example
      harmful output, mandate breach, unexpected autonomous action, drift beyond tolerance.
  - id: D3
    text: Confirm roles, notification paths, timeframes per severity and the authority to contain or halt.
  - id: D4
    text: Confirm the containment mechanism is specified and testable, including who may invoke it and
      how quickly it takes effect.
  - id: D5
    text: Confirm post-incident review, root cause and the route by which lessons change a control.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when the procedure is generic
      and does not name AI failure types, or containment authority is unclear. INADEQUATE when no trigger
      or severity scheme exists. NOT TESTABLE when the procedure is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of incidents and near misses in the period from the incident system, and
      cross-check against monitoring alerts and complaint or override records for events that were never
      raised as incidents.
  - id: O2
    text: Sample incidents and verify detection-to-notification and notification-to-containment times
      against the stated targets.
  - id: O3
    text: Verify containment was invoked by an authorised role and took effect, with evidence from the
      system rather than the ticket.
  - id: O4
    text: Trace post-incident actions to closure and to any control change they required.
  - id: O5
    text: Where no incident occurred, test the mechanism — an exercise, a tabletop with evidence, or a
      controlled invocation in a non-production environment.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when incidents were detected, escalated within target and contained,
      with lessons carried into controls. PARTIALLY EFFECTIVE when handling occurred but timings or closure
      are unevidenced. INEFFECTIVE when events were not raised or containment failed. NOT TESTABLE when
      no incident and no exercise occurred in the period.'
  near_miss_failure_modes:
  - F1. Zero AI incidents in the period is presented as strength, with no near-miss capture and no exercise
    to show the process would engage.
  - F2. Events appear in the monitoring or complaint records but were never raised as incidents, so the
    population is understated.
  - F3. The kill switch is documented but has never been invoked, and no one can state how long it takes
    to take effect.
  - F4. Severity was assigned after resolution, and always at a level that avoided external notification.
  - F5. Post-incident actions are closed as 'awareness raised' with no control change.
  - F6. Containment is evidenced by a ticket status rather than by system evidence that the agent stopped
    acting.
  resolutions:
  - failure_mode: F1
    text: A near-miss register, or an exercise report with date, participants and observed timings.
  - failure_mode: F2
    text: A reconciliation from alerts and complaints to incidents, with any unraised events explained.
  - failure_mode: F3
    text: A containment test with a measured time to effect.
  - failure_mode: F4
    text: A severity assignment dated at detection, with the criteria applied.
  - failure_mode: F5
    text: A post-incident action that amended a control, with the amended control identified.
  - failure_mode: F6
    text: System evidence of containment — revoked credentials, disabled route, halted queue.
  population_and_evidence_floor: 'Population: all incidents and near misses in the period, cross-checked
    against alerts, overrides and complaints. Evidence floor: zero incidents and no exercise means the
    mechanism is untested — report NOT TESTABLE rather than PASS.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
