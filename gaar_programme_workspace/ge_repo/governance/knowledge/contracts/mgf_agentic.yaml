- framework: MGF Agentic
  control_id: D3.6
  title: Plan & reasoning logging
  requirement: Make agent intent inspectable
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Material agent plans, intentions or reasoning traces needed for assurance are recorded at the
      required level.
    scope: model
    applies_when: null
    locator: controls.D3.6.elements[0]
  - id: e2
    text: Recorded traces are attributable, time-bound and protected against unauthorised alteration.
    scope: model
    applies_when: null
    locator: controls.D3.6.elements[1]
  - id: e3
    text: Retention and access rules allow authorised reviewers to inspect the traces needed for governance
      and incident analysis.
    scope: model
    applies_when: null
    locator: controls.D3.6.elements[2]
  boundary:
    none: no logging, or logging that cannot attribute an action to a system, version or identity.
    partial: logging operates but reconstruction requires supplementation, or integrity and retention
      are not evidenced.
    full: a real event has been reconstructed end to end from retained, integrity-protected records within
      the stated retrieval time.
  owner: Model Owner / AI Risk (2nd line)
  expected_evidence:
  - plan/reasoning log
  - retention policy
  - review access controls
  - timestamp/identity metadata
  - trace integrity controls
  - trace specification
  linked_play:
  - Play 3, 5
  test_of_design:
  - id: D1
    text: Obtain the logging or traceability design for Plan & reasoning logging — what is captured, at
      what granularity, where it is stored and for how long.
  - id: D2
    text: Confirm the captured fields are sufficient to reconstruct a specific decision or action after
      the fact, including the inputs, the version in force and the identity that acted.
  - id: D3
    text: Confirm integrity controls — who can amend or delete, and how tampering would be detected.
  - id: D4
    text: Confirm retention meets the longest applicable obligation and that retrieval within a stated
      time is possible.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold. PARTIALLY ADEQUATE when capture is defined but integrity
      or retention is not. INADEQUATE when reconstruction is impossible from the defined fields. NOT TESTABLE
      when the design is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Select a specific past event — an incident, a material decision or a random production action
      — and attempt reconstruction end to end from the logs alone.
  - id: O2
    text: 'Verify completeness across the period: sampling intervals, volumes and any interruption in
      capture.'
  - id: O3
    text: 'Test integrity: confirm access to amend is restricted and inspect any amendment record.'
  - id: O4
    text: Test retrieval against the stated time and confirm records at the oldest end of the retention
      window are still retrievable.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when a real event can be reconstructed from retained records within
      the stated time. PARTIALLY EFFECTIVE when reconstruction succeeds with gaps or manual supplementation.
      INEFFECTIVE when the event cannot be reconstructed. NOT TESTABLE when no suitable event exists in
      the period.'
  near_miss_failure_modes:
  - F1. Logs exist but hold no version identifier, so it is impossible to say which model or prompt produced
    the output.
  - F2. The acting identity is a shared service account for every action, so attribution stops at the
    platform.
  - F3. Reconstruction requires a person's recollection or a chat thread to fill the gap between records.
  - F4. Retention is set below the obligation, or the oldest records are technically retained but not
    retrievable.
  - F5. Administrators can amend the records with no separate audit of the amendment.
  - F6. Prompt and tool-call content is not captured, so only the outcome is visible and not the reasoning
    path.
  resolutions:
  - failure_mode: F1
    text: A log schema including model, prompt and configuration version, with a populated example.
  - failure_mode: F2
    text: Per-actor identity in the record, or a documented mapping from service account to the initiating
      human or agent.
  - failure_mode: F3
    text: A reconstruction walkthrough of a real event using only retained records.
  - failure_mode: F4
    text: A retention configuration matching the obligation and a successful retrieval from the oldest
      window.
  - failure_mode: F5
    text: An access review of amendment rights plus an immutable or separately audited amendment trail.
  - failure_mode: F6
    text: Captured prompt and tool-call records for a sampled action.
  population_and_evidence_floor: 'Population: the logged record set for the period, plus at least one
    real event selected for reconstruction. Evidence floor: no reconstruction attempt makes the operating
    result NOT TESTABLE — the existence of logs is a design fact, not an operating one.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
