schema_version: 0.5.1.control-contract.3
framework: MGF Agentic
source_workbook: AI_Governance_Playbook_MGF_SAFR_v0.5.1_contracts.xlsx
control_count: 34
controls:
- framework: MGF Agentic
  control_id: D1.1
  title: Use-case suitability assessment
  requirement: Stop agents being deployed in unsuitable / high-impact contexts
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Use-case suitability is assessed against defined suitability and impact criteria before development
      or deployment decisions are made.
    scope: model
    applies_when: null
    locator: controls.D1.1.elements[0]
  - id: e2
    text: Unsuitable or prohibited high-impact use cases are explicitly identified and excluded or escalated.
    scope: model
    applies_when: null
    locator: controls.D1.1.elements[1]
  - id: e3
    text: The assessment considers the agent’s actual autonomy, tools, data access and area of impact
      rather than an abstract model description.
    scope: model
    applies_when: null
    locator: controls.D1.1.elements[2]
  - id: e4
    text: The suitability decision and its rationale are recorded before the agent is approved for build
      or deployment.
    scope: model
    applies_when: null
    locator: controls.D1.1.elements[3]
  boundary:
    none: no methodology, or assessments performed with no criteria.
    partial: a methodology exists and is used, but timing, independence, threshold discipline or reassessment
      is not evidenced.
    full: assessments are complete, timely, independent of the requester, reperformable from the recorded
      facts, and drive the controls their outcome obliges.
  owner: AI Risk (2nd line) / Model Owner
  expected_evidence:
  - approval record
  - approved suitability methodology
  - architecture / capability inventory
  - dated suitability decision
  - exclusion criteria
  - risk decision / escalation record
  - use-case assessment record
  - use-case scope
  linked_play:
  - Play 1, 2
  test_of_design:
  - id: D1
    text: Obtain the approved methodology and template for Use-case suitability assessment — trigger,
      criteria, scoring or classification scheme, and the decision each outcome drives.
  - id: D2
    text: 'Confirm the criteria are discriminating: different inputs produce different outcomes, and the
      thresholds between tiers are stated numerically or by defined rule rather than by judgement alone.'
  - id: D3
    text: Confirm the assessment must be completed before the decision it informs, and who approves the
      outcome.
  - id: D4
    text: Confirm reassessment triggers — material change, incident, elapsed time — and who is accountable
      for detecting them.
  - id: D5
    text: 'Confirm what an outcome obliges: which controls a tier turns on, so classification is load-bearing
      rather than descriptive.'
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the method exists
      but thresholds or consequences are undefined. INADEQUATE when outcomes drive nothing. NOT TESTABLE
      when the approved methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all use cases requiring an assessment in the period, taken from the
      inventory or intake log.'
  - id: O2
    text: Sample across tiers, including at least one that was classified into the lowest tier — the classification
      most likely to be wrong and least likely to be challenged.
  - id: O3
    text: Reperform the classification from the underlying facts and compare to the recorded outcome.
      A reperformance that disagrees is a finding regardless of the approver's seniority.
  - id: O4
    text: 'Verify timing: the assessment date precedes the decision date. Verify reassessment where a
      trigger occurred.'
  - id: s5
    text: 'Operating verdict: EFFECTIVE when reperformance agrees, timing holds and triggers were acted
      on. PARTIALLY EFFECTIVE when assessments are complete but late, or a low-tier outcome cannot be
      supported. INEFFECTIVE when assessments are missing for material use or systematically under-tier.
      NOT TESTABLE when the population of in-scope use cases cannot be established.'
  near_miss_failure_modes:
  - F1. Every use case lands in the same tier, which means the scheme is not discriminating or is being
    applied to reach a pre-decided answer.
  - F2. The assessment is dated after the go-live date, so it documented a decision rather than informing
    it.
  - F3. The assessor and the requester are the same person or the same team.
  - F4. A low-tier classification rests on a scope statement that excludes the risky part of the system
    — for example classifying a copilot as advisory while it writes to a system of record.
  - F5. Reassessment triggers exist on paper but no reassessment occurred despite a material model or
    vendor change in the period.
  resolutions:
  - failure_mode: F1
    text: A tier distribution across the population, with the rationale for outliers in either direction.
  - failure_mode: F2
    text: An assessment record dated before the approval or go-live date, or a documented retrospective
      acceptance.
  - failure_mode: F3
    text: An approval by a role outside the delivery team, named in the record.
  - failure_mode: F4
    text: A scope statement that enumerates the system's write paths and downstream effects, reassessed
      on that basis.
  - failure_mode: F5
    text: A reassessment record tied to the change that triggered it.
  population_and_evidence_floor: 'Population: all use cases requiring assessment in the period, from the
    intake log or AI inventory. Evidence floor: fewer than 3 assessments, or no sample from the lowest
    tier, makes the operating result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: MGF Agentic
  control_id: D1.2
  title: Tiered risk classification
  requirement: Right-size controls to the level of risk
  requirement_source: playbook_workbook + Requirement Element Audit
  requirement_authority: draft_derived
  source_instrument: instruments/Mgf_for_Agentic_AI_(atx_Release)_July_2026.txt
  source_basis:
  - MGF Agentic §2.1.1 identifies risk as likelihood and impact and sets out factors affecting impact
    and likelihood.
  - MGF Agentic Dayos example describes classification by severity of impact, reversibility, and feasibility
    of human oversight, with tier-dependent autonomy responses.
  - Requirement Element Audit MGF Agentic D1.2 defines six atomic elements for tiered risk classification.
  elements:
  - id: e1
    text: An approved methodology for tiered risk classification exists, with defined criteria.
    scope: model
    applies_when: null
    locator: controls.D1.2.elements[0]
  - id: e2
    text: Tier or outcome thresholds are stated by rule rather than by unaided judgement.
    scope: model
    applies_when: null
    locator: controls.D1.2.elements[1]
  - id: e3
    text: The assessment is required before the decision it informs.
    scope: model
    applies_when: null
    locator: controls.D1.2.elements[2]
  - id: e4
    text: The outcome is approved by a role independent of the requester.
    scope: model
    applies_when: null
    locator: controls.D1.2.elements[3]
  - id: e5
    text: Each outcome obliges a defined set of controls or gates.
    scope: model
    applies_when: null
    locator: controls.D1.2.elements[4]
  - id: e6
    text: Reassessment triggers are defined and detected.
    scope: model
    applies_when: null
    locator: controls.D1.2.elements[5]
  boundary:
    none: no approved methodology or no assessable criteria.
    partial: a methodology exists and is used, but one or more timing, independence, threshold, control-mapping,
      or reassessment dimensions is not evidenced.
    full: all six applicable elements are evidenced with a reproducible classification method, timely
      assessment, independent approval, load-bearing control mapping, and operational reassessment detection.
  owner: AI Risk (2nd line) / Model Owner
  expected_evidence:
  - approved tiering methodology and criteria
  - tier/outcome rules or thresholds
  - dated assessment record
  - independent approval record
  - tier-to-control/gate mapping
  - reassessment trigger and detection record
  linked_play:
