- framework: MGF Agentic
  control_id: D4.1
  title: Transparency to interacting users
  requirement: Let users understand who/what they deal with
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Users interacting with an agent are clearly informed that they are interacting with an AI agent
      where disclosure is relevant.
    scope: model
    applies_when: null
    locator: controls.D4.1.elements[0]
  - id: e2
    text: Users receive information about the agent’s capabilities, scope and material limitations.
    scope: model
    applies_when: null
    locator: controls.D4.1.elements[1]
  - id: e3
    text: Material agent actions, uncertainty or approval boundaries are presented in a way that supports
      responsible user judgement.
    scope: model
    applies_when: null
    locator: controls.D4.1.elements[2]
  boundary:
    none: no disclosure requirement, or in-scope interactions with no disclosure.
    partial: disclosure is required and present in some channels, but coverage, timing or currency is
      not evidenced.
    full: approved, current disclosure is delivered at the right point in every in-scope channel, with
      any promised recourse demonstrably working.
  owner: Model Owner / Compliance
  expected_evidence:
  - action/decision disclosure
  - capability/limitation disclosure
  - interface notice
  - user disclosure
  - user guidance
  - user interaction design
  linked_play:
  - Play 11
  test_of_design:
  - id: D1
    text: Obtain the disclosure or transparency requirement for Transparency to interacting users — who
      must be told what, at what point, and in what form.
  - id: D2
    text: 'Confirm the content requirement is specific: that AI is in use, what it does, its limitations,
      and the route to a human or to contest an outcome, as applicable.'
  - id: D3
    text: Confirm the trigger and timing relative to the interaction or decision.
  - id: D4
    text: Confirm who approves the wording and how it is kept current when the system changes.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold. PARTIALLY ADEQUATE when a disclosure requirement
      exists but content or timing is unspecified. INADEQUATE when no requirement is defined for an in-scope
      interaction. NOT TESTABLE when the requirement is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of in-scope interactions, channels or decisions in the period.
  - id: O2
    text: Observe the disclosure as delivered in each channel rather than as specified — capture the live
      artefact.
  - id: O3
    text: 'Verify timing: the disclosure precedes or accompanies the interaction rather than appearing
      in terms accepted long before.'
  - id: O4
    text: 'Verify currency: the wording matches the system''s current behaviour and limitations.'
  - id: O5
    text: Where contest or human-referral is promised, test that the route works and is answered.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when disclosure was delivered in every in-scope channel, on time,
      accurately and with working recourse. PARTIALLY EFFECTIVE when delivered inconsistently across channels
      or out of date. INEFFECTIVE when in-scope interactions carried no disclosure. NOT TESTABLE when
      the channel population cannot be established.'
  near_miss_failure_modes:
  - F1. Disclosure is present in the main web journey and absent in the app, the call centre script or
    the partner channel.
  - F2. Disclosure sits in terms and conditions accepted at onboarding, years before the AI was introduced.
  - F3. The wording describes an earlier version of the system and overstates or understates what it does.
  - F4. A human-referral route is promised and the queue behind it is unstaffed.
  - F5. Evidence is the approved wording document rather than a capture of what the customer actually
    sees.
  resolutions:
  - failure_mode: F1
    text: A per-channel capture of the delivered disclosure.
  - failure_mode: F2
    text: A disclosure at the point of interaction, dated after the AI introduction.
  - failure_mode: F3
    text: A wording review dated after the most recent material system change.
  - failure_mode: F4
    text: Response-time evidence for the recourse route.
  - failure_mode: F5
    text: A screenshot, recording or transcript from the live channel.
  population_and_evidence_floor: 'Population: all in-scope channels and interaction types in the period.
    Evidence floor: fewer than all channels observed, or observation from specification rather than delivery,
    makes the operating result NOT TESTABLE for the unobserved channels.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
