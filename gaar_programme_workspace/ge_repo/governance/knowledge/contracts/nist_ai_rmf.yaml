  - id: O2
    text: Sample at least three meetings including every meeting at which a high-materiality matter was
      decided. Verify attendance against quorum.
  - id: O3
    text: 'Reperform: trace each sampled material AI matter to a recorded decision, a named decision-maker
      and a dated action, then trace open actions to closure or formal acceptance.'
  - id: O4
    text: Inspect any period in which the cadence was missed and the disposition of that gap.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when the body met at cadence, decided the material matters in
      scope, and actions were tracked. PARTIALLY EFFECTIVE when it operated but decisions or follow-up
      are incomplete. INEFFECTIVE when material matters bypassed the body. NOT TESTABLE when the population
      cannot be established.'
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than
    deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification
    date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not
    record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings
    without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved
    before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance
      naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period,
    established from the governance calendar or decision register. Evidence floor: fewer than 3 meetings
    or fewer than 1 material decision available to inspect makes the operating result NOT TESTABLE rather
    than a PASS.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: MEASURE 2.9
  title: The AI model is explained, validated and documented, and AI system output is interpreted within
    its context to inform responsible use and governance.
  requirement: MEASURE 2.9
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should verify systems are developed to produce explainable models, post-hoc
      explanations and audit logs.
    scope: model
    applies_when: null
    locator: controls.MEASURE 2.9.elements[0]
  - id: e2
    text: The organisation should when possible or available, utilize approaches that are inherently explainable,
      such as traditional and penalized generalized linear models , decision trees, nearest-neighbor and
      prototype-based approaches, rule-based models, generalized additive models , explainable boosting
      machines and neural additive models.
    scope: model
    applies_when: null
    locator: controls.MEASURE 2.9.elements[1]
  - id: e3
    text: The organisation should test explanation methods and resulting explanations prior to deployment
      to gain feedback from relevant AI actors, end users, and potentially impacted individuals or groups
      about whether explanations are accurate, clear, and understandable.
    scope: model
    applies_when: null
    locator: controls.MEASURE 2.9.elements[2]
  boundary:
    none: no validation, or a report with no acceptance criteria and no independence.
    partial: validation was performed but is stale against the deployed version, not independent, or thresholds
      and shortfall disposition are not evidenced.
    full: the deployed version was independently validated against pre-stated thresholds, with retained
      results and every shortfall remediated or formally accepted.
  owner: Indep. Validation / InfoSec
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 3
  test_of_design:
  - id: D1
    text: Obtain the approved validation or evaluation methodology for The AI model is explained, validated
      and documented, and AI system output is interpreted within its context to inform responsible use
      and governance — scope, test types, datasets, metrics and acceptance thresholds.
  - id: D2
    text: Confirm acceptance thresholds are stated in advance of testing and are specific to the use case
      rather than generic.
  - id: D3
    text: 'Confirm independence: who performs the validation and how they are separated from the team
      that built the system.'
  - id: D4
    text: Confirm the methodology covers the failure modes the system can actually produce, including
      the ones a benchmark score does not capture.
  - id: D5
    text: Confirm the disposition rule — what happens when a threshold is missed, and who may accept a
      shortfall.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when tests are defined
      but thresholds are set after results, or independence is unclear. INADEQUATE when no acceptance
      criterion exists. NOT TESTABLE when the methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: every model, prompt or agent version promoted in the period.'
  - id: O2
    text: For a sample, obtain the validation report and check it covers the version actually deployed
      — compare version identifiers and dates, not titles.
  - id: O3
    text: Reperform or recompute at least one reported metric from the underlying results where the data
      permits.
  - id: O4
    text: Trace every shortfall against threshold to a remediation, a re-test or an approved acceptance
      by a role with authority to grant it.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when each deployed version has independent validation against
      pre-stated thresholds and shortfalls are dispositioned. PARTIALLY EFFECTIVE when validation exists
      but is stale, non-independent or partly unevidenced. INEFFECTIVE when versions reached production
      unvalidated. NOT TESTABLE when the version population or the underlying results are unavailable.'
  near_miss_failure_modes:
  - F1. The validation report predates the deployed version — it validates the model that was tested,
    not the one that is running.
  - F2. The validator sits in the same reporting line as the builder, so 'independent review' is a signature
    rather than a challenge.
  - F3. The acceptance threshold was chosen after the result was known, which makes a pass unfalsifiable.
  - F4. The test set overlaps the tuning or training data, so the reported score measures memorisation.
  - F5. A metric is reported with no sample size, so a favourable number may rest on a handful of cases.
  - F6. Only aggregate performance is reported — no slice, subgroup or worst-case analysis where the control
    requires it.
  resolutions:
  - failure_mode: F1
    text: A validation report whose version identifier matches the deployed artefact, or a re-validation
      of the current version.
  - failure_mode: F2
    text: A validation performed or signed by a function outside the delivery reporting line, with the
      reviewer named.
  - failure_mode: F3
    text: A pre-registered threshold — an approved test plan dated before the test run.
  - failure_mode: F4
    text: A statement of dataset provenance and separation, or a held-out set with documented construction.
  - failure_mode: F5
    text: Reported metrics with denominators and confidence, or the underlying result file.
  - failure_mode: F6
    text: Slice-level results for the populations the control names.
  population_and_evidence_floor: 'Population: all model, prompt or agent versions promoted in the period.
    Evidence floor: fewer than 1 validated version in the period, or reports with no version identifier,
    makes the operating result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: MEASURE 2.10
  title: Privacy risk of the AI system, as identified in the MAP function, is examined and documented.
  requirement: MEASURE 2.10
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should specify privacy-related values, frameworks, and attributes that are
      applicable in the context of use through direct engagement with end users and potentially impacted
      groups and communities.
    scope: model
    applies_when: null
    locator: controls.MEASURE 2.10.elements[0]
  - id: e2
    text: The organisation should document collection, use, management, and disclosure of personally sensitive
      information in datasets, in accordance with privacy and data governance policies
    scope: model
    applies_when: null
    locator: controls.MEASURE 2.10.elements[1]
  - id: e3
    text: The organisation should quantify privacy-level data aspects such as the ability to identify
      individuals or groups (e.g. k-anonymity metrics, l-diversity, t-closeness).
    scope: model
    applies_when: null
    locator: controls.MEASURE 2.10.elements[2]
  boundary:
    none: no identified sources, or sources in use with no permitted-use basis.
    partial: sources are identified and approved but quality measurement, deletion propagation or lineage
      versioning is not evidenced.
    full: every live source is approved with a permitted-use basis, quality is measured against thresholds,
      deletion propagates to derived stores and lineage is version-specific.
  owner: Indep. Validation / InfoSec
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 3
  test_of_design:
  - id: D1
    text: Obtain the data requirement covering Privacy risk of the AI system, as identified in the MAP
      function, is examined and documented — which datasets are in scope, the quality attributes required
      and the lineage that must be recorded.
  - id: D2
    text: Confirm the permitted-use basis for each source is established, including personal data, licensed
      data and data whose terms restrict model training.
  - id: D3
    text: Confirm quality criteria are measurable and have thresholds, rather than aspirational adjectives.
  - id: D4
    text: Confirm retention, deletion and the handling of data-subject or contractual deletion requests
      where a model or index has already absorbed the data.
  - id: D5
    text: Confirm who approves a new data source into the system.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when quality criteria exist without
      thresholds, or deletion in the model or index is unaddressed. INADEQUATE when permitted use is undefined.
      NOT TESTABLE when the requirement is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of data sources feeding the system in the period, taken from the pipeline
      or retrieval configuration rather than from documentation.
  - id: O2
    text: Verify each source has a recorded permitted-use basis and an approval.
  - id: O3
    text: Sample and test the quality attributes against their thresholds, using the retained measurement
      rather than a statement.
  - id: O4
    text: Trace a deletion or correction request through to the model, index or cache that holds it.
  - id: O5
    text: Verify lineage is sufficient to say which data version produced a given behaviour.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when every live source is approved with a permitted-use basis,
      quality is measured against thresholds and deletion propagates. PARTIALLY EFFECTIVE when sources
      are governed but measurement or propagation is unevidenced. INEFFECTIVE when unapproved sources
      are live. NOT TESTABLE when the source population cannot be established from the pipeline.'
  near_miss_failure_modes:
  - F1. The documented source list and the retrieval configuration disagree, and only the document was
    assessed.
  - F2. Permitted use was assessed for analytics and not for model training or retrieval, which are different
    bases.
  - F3. Quality is described as 'reviewed for accuracy' with no measurement and no threshold.
  - F4. Deletion is honoured in the source system while the vector index or cache retains the content.
  - F5. A new source was added by a configuration change that never entered the data governance route.
  - F6. Lineage stops at the dataset name, with no version or snapshot date.
  resolutions:
  - failure_mode: F1
    text: A pipeline or retrieval configuration export reconciled to the documented source list.
  - failure_mode: F2
    text: A permitted-use assessment naming the specific processing purpose.
  - failure_mode: F3
    text: A measured quality result against a stated threshold.
  - failure_mode: F4
    text: Evidence of deletion propagating to the index or cache, with a re-query showing absence.
  - failure_mode: F5
    text: An approval record for the source addition, tied to the configuration change.
  - failure_mode: F6
    text: A lineage record carrying dataset version or snapshot date.
  population_and_evidence_floor: 'Population: all data sources feeding the system in the period, from
    pipeline or retrieval configuration. Evidence floor: a source list taken from documentation rather
    than the pipeline cannot establish completeness — report NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
