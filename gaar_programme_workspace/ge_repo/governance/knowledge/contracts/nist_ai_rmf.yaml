  test_of_design:
  - id: D1
    text: Obtain the change or release procedure covering Mechanisms are established to enable the team
      that developed or deployed AI systems to regularly incorporate adjudicated feedback from relevant
      AI actors into system design and implementation — change classes, required approvals per class,
      testing gates and the record fields captured.
  - id: D2
    text: 'Confirm the record captures the AI-specific artefacts that change behaviour: model version,
      prompt or system-instruction version, tool or data-source configuration, and retrieval corpus where
      applicable.'
  - id: D3
    text: Confirm approval must precede implementation, and who may approve each class. Confirm the emergency
      route, its eligibility criteria and its retrospective approval window.
  - id: D4
