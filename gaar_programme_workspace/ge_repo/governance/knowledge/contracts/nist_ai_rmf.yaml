      and risks identified in MAP-1.
    scope: model
    applies_when: null
    locator: controls.MAP 3.5.elements[0]
  - id: e2
    text: The organisation should establish practices for AI systems' oversight in accordance with policies
      developed in GOVERN-1.
    scope: model
    applies_when: null
    locator: controls.MAP 3.5.elements[1]
  - id: e3
    text: The organisation should define and develop training materials for relevant AI Actors about AI
      system performance, context of use, known limitations and negative impacts, and suggested warning
      labels.
    scope: model
    applies_when: null
    locator: controls.MAP 3.5.elements[2]
  boundary:
    none: no approved policy, or a document with no owner and no scope.
    partial: an approved policy exists but lacks an exception route, an implementing control, or sampled
      activity does not consistently follow it.
    full: the policy is approved, current, scoped, owned, implemented by a named control, and sampled
      activity follows it with exceptions governed.
  owner: Model Owner + AI Risk
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play: []
  test_of_design:
  - id: D1
    text: Obtain the approved policy or standard covering Processes for human oversight are defined, assessed
      and documented in accordance with organizational policies from the GOVERN function, with its approval
      record, owner and version history.
  - id: D2
    text: Confirm it states scope (which systems, models and uses it binds), prohibited and controlled
      uses, the accountable owner and the consequence of non-compliance.
  - id: D3
    text: Confirm it defines the exception route — who may grant one, on what basis, for how long, and
      where exceptions are recorded.
  - id: D4
    text: Confirm the review cycle and the triggers for out-of-cycle review, and that the document is
      within its cycle.
  - id: D5
    text: Confirm the policy is mapped to the controls, plays or procedures that implement it, so a requirement
      is not left with nothing that operates it.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D5 identifies at least one implementing control.
      PARTIALLY ADEQUATE when the policy exists but the exception route or implementing link is absent.
      INADEQUATE when scope or ownership is undefined. NOT TESTABLE when the approved document is not
      produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: AI use cases, systems or activities in scope of the policy during the
      period, taken from the AI inventory rather than from a list supplied by the assessed team.'
  - id: O2
    text: Sample across materiality tiers and include at least one use case that went live in the period.
  - id: O3
    text: 'Reperform: verify each sampled item was assessed against the policy at the required point,
      and that any required attestation or approval exists and predates the activity.'
  - id: O4
    text: Inspect the exception and breach records for the period — verify each is dated, owned, time-bound
      and dispositioned.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when sampled use follows the approved policy and exceptions are
      governed. PARTIALLY EFFECTIVE when compliance is inconsistent or exceptions are open past expiry.
      INEFFECTIVE when the policy was bypassed for material use. NOT TESTABLE when the in-scope population
      cannot be established.'
  near_miss_failure_modes:
  - F1. The policy is approved but has no implementing procedure — nothing in the operating environment
    makes the requirement happen.
  - F2. Scope is written so broadly ('all AI use') that no one can tell whether a given system is in or
    out.
  - F3. Exceptions are granted by the same team that needs them, with no expiry.
  - F4. The policy was approved in the period but the sampled use cases predate it and were never reassessed
    against it.
  - F5. A breach register exists but every entry is closed as 'noted' with no remediation or acceptance.
  resolutions:
  - failure_mode: F1
    text: A named procedure, runbook or control that implements the clause, with an owner.
  - failure_mode: F2
    text: A scope statement with inclusion and exclusion criteria, or a mapping from the inventory to
      in-scope flag.
  - failure_mode: F3
    text: An exception record showing an independent grantor, a stated basis and an expiry date.
  - failure_mode: F4
    text: A reassessment record for pre-existing use cases, or an approved grandfathering decision.
  - failure_mode: F5
    text: A breach entry with a remediation action, owner and closure evidence, or a formal risk acceptance.
  population_and_evidence_floor: 'Population: all in-scope AI use cases or activities in the period, drawn
    from the AI inventory. Evidence floor: fewer than 3 sampled items, or an inventory that cannot be
    reconciled, makes the operating result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: MAP 4.1
  title: Approaches for mapping AI technology and legal risks of its components, including the use of
    third-party data or software, are in place, followed and documented, as are risks of infringement
    of a third party's intellectual property or other rights.
  requirement: MAP 4.1
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should review audit reports, testing results, product roadmaps, warranties,
      terms of service, end user license agreements, contracts, and other documentation related to third-party
      entities to assist in value assessment and risk management activities.
    scope: model
    applies_when: null
    locator: controls.MAP 4.1.elements[0]
  - id: e2
    text: The organisation should review third-party software release schedules and software change management
      plans (hotfixes, patches, updates, forward- and backward- compatibility guarantees) for irregularities
      that may contribute to AI system risks.
    scope: model
    applies_when: null
    locator: controls.MAP 4.1.elements[1]
  - id: e3
    text: The organisation should inventory third-party material (hardware, open-source software, foundation
      models, open source data, proprietary software, proprietary data, etc.) required for system implementation
      and maintenance.
    scope: model
    applies_when: null
    locator: controls.MAP 4.1.elements[2]
  boundary:
    none: no third-party assessment for AI providers, or providers in production with no assessment.
    partial: onboarding diligence occurred but contractual rights, sub-processor scope or ongoing oversight
      is not evidenced.
    full: assessments preceded use, required clauses are present in executed contracts, and ongoing oversight
      operated with findings dispositioned.
  owner: Model Owner + AI Risk
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 7
  test_of_design:
  - id: D1
    text: Obtain the third-party requirements covering Approaches for mapping AI technology and legal
      risks of its components, including the use of third-party data or software, are in place, followed
      and documented, as are risks of infringement of a third party's intellectual property or other rights
      — the due-diligence scope, the contractual clauses required and the approval route before onboarding.
  - id: D2
    text: Confirm the due diligence covers what the provider does with the institution's data, the provider's
      own model change practice, and its notification obligations on material change or incident.
  - id: D3
    text: 'Confirm contractual rights: audit or assurance report access, notification periods, exit and
      transition, and liability for model behaviour.'
  - id: D4
    text: Confirm the ongoing obligation — reassessment cadence, performance monitoring and the trigger
      for re-approval.
  - id: D5
    text: Confirm the treatment of sub-processors and of models embedded in a purchased product, where
      the AI is not the thing being bought.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when diligence is defined but
      ongoing obligations or embedded-AI treatment is absent. INADEQUATE when no pre-onboarding assessment
      is required. NOT TESTABLE when the requirements are not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of AI-relevant third parties in the period from procurement or vendor-management
      data, including products with embedded AI, not only AI vendors.
  - id: O2
    text: Sample and verify a completed assessment dated before contract signature or before first production
      use.
  - id: O3
    text: Verify the required clauses are present in the executed contract, read from the contract rather
      than the checklist.
  - id: O4
    text: Verify ongoing obligations operated — reassessment at cadence, assurance reports obtained and
      reviewed with findings dispositioned, and provider change notifications acted on.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when assessments preceded use, clauses are present and ongoing
      obligations ran. PARTIALLY EFFECTIVE when onboarding was controlled but ongoing oversight is unevidenced.
      INEFFECTIVE when material providers were onboarded unassessed. NOT TESTABLE when the vendor population
      cannot be established.'
  near_miss_failure_modes:
  - F1. The provider was assessed as a software vendor before the AI feature was enabled, and never reassessed
    when it was.
  - F2. The assessment is dated after contract signature, so it recorded a decision already taken.
  - F3. The contract references an assurance report that was never obtained, or one that excludes the
    AI component from scope.
  - F4. Sub-processors are named in the provider's terms but were never assessed.
  - F5. Provider change notifications arrive but there is no route by which they reach the control owner.
  - F6. The provider's own model changes silently under a continuously updated service, with no version
    pinning and no notification right.
  resolutions:
  - failure_mode: F1
    text: A reassessment triggered by the AI feature being enabled.
  - failure_mode: F2
    text: An assessment record dated before signature, or an approved exception.
  - failure_mode: F3
    text: The assurance report itself, with its scope section showing the AI component in scope.
  - failure_mode: F4
    text: A sub-processor list with assessment status.
  - failure_mode: F5
    text: A routing record showing a provider notification reaching and being actioned by the control
      owner.
  - failure_mode: F6
    text: A version-pinning or change-notification clause and evidence of it operating.
  population_and_evidence_floor: 'Population: all AI-relevant third parties and AI-embedded products in
    use during the period, from procurement or vendor-management data. Evidence floor: a vendor list supplied
    by the assessed team without procurement reconciliation makes the completeness result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
