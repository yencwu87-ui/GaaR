- framework: NIST AI RMF
  control_id: MAP 3.4
  title: Processes for operator and practitioner proficiency with AI system performance and trustworthiness,
    and relevant technical standards and certifications, are defined, assessed and documented.
  requirement: MAP 3.4
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should identify and declare AI system features and capabilities that may affect
      downstream AI actors' decision-making in deployment and operational settings for example how system
      features and capabilities may activate known risks in various human-AI configurations, such as selective
      adherence.
    scope: model
    applies_when: null
    locator: controls.MAP 3.4.elements[0]
  - id: e2
    text: The organisation should identify skills and proficiency requirements for operators, practitioners
      and other domain experts that interact with AI systems,Develop AI system operational
    scope: model
    applies_when: null
    locator: controls.MAP 3.4.elements[1]
  - id: e3
    text: The organisation should define and develop training materials for proposed end users, practitioners
      and operators about AI system use and known limitations.
    scope: model
    applies_when: null
    locator: controls.MAP 3.4.elements[2]
  boundary:
    none: no approved policy, or a document with no owner and no scope.
    partial: an approved policy exists but lacks an exception route, an implementing control, or sampled
      activity does not consistently follow it.
    full: the policy is approved, current, scoped, owned, implemented by a named control, and sampled
      activity follows it with exceptions governed.
  owner: Model Owner + AI Risk
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play: []
  test_of_design:
  - id: D1
    text: Obtain the approved policy or standard covering Processes for operator and practitioner proficiency
      with AI system performance and trustworthiness, and relevant technical standards and certifications,
      are defined, assessed and documented, with its approval record, owner and version history.
  - id: D2
    text: Confirm it states scope (which systems, models and uses it binds), prohibited and controlled
      uses, the accountable owner and the consequence of non-compliance.
  - id: D3
    text: Confirm it defines the exception route — who may grant one, on what basis, for how long, and
      where exceptions are recorded.
  - id: D4
    text: Confirm the review cycle and the triggers for out-of-cycle review, and that the document is
      within its cycle.
  - id: D5
    text: Confirm the policy is mapped to the controls, plays or procedures that implement it, so a requirement
      is not left with nothing that operates it.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D5 identifies at least one implementing control.
      PARTIALLY ADEQUATE when the policy exists but the exception route or implementing link is absent.
      INADEQUATE when scope or ownership is undefined. NOT TESTABLE when the approved document is not
      produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: AI use cases, systems or activities in scope of the policy during the
      period, taken from the AI inventory rather than from a list supplied by the assessed team.'
  - id: O2
    text: Sample across materiality tiers and include at least one use case that went live in the period.
  - id: O3
    text: 'Reperform: verify each sampled item was assessed against the policy at the required point,
      and that any required attestation or approval exists and predates the activity.'
  - id: O4
    text: Inspect the exception and breach records for the period — verify each is dated, owned, time-bound
      and dispositioned.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when sampled use follows the approved policy and exceptions are
      governed. PARTIALLY EFFECTIVE when compliance is inconsistent or exceptions are open past expiry.
      INEFFECTIVE when the policy was bypassed for material use. NOT TESTABLE when the in-scope population
      cannot be established.'
  near_miss_failure_modes:
  - F1. The policy is approved but has no implementing procedure — nothing in the operating environment
    makes the requirement happen.
  - F2. Scope is written so broadly ('all AI use') that no one can tell whether a given system is in or
    out.
  - F3. Exceptions are granted by the same team that needs them, with no expiry.
  - F4. The policy was approved in the period but the sampled use cases predate it and were never reassessed
    against it.
  - F5. A breach register exists but every entry is closed as 'noted' with no remediation or acceptance.
  resolutions:
  - failure_mode: F1
    text: A named procedure, runbook or control that implements the clause, with an owner.
  - failure_mode: F2
    text: A scope statement with inclusion and exclusion criteria, or a mapping from the inventory to
      in-scope flag.
  - failure_mode: F3
    text: An exception record showing an independent grantor, a stated basis and an expiry date.
  - failure_mode: F4
    text: A reassessment record for pre-existing use cases, or an approved grandfathering decision.
  - failure_mode: F5
    text: A breach entry with a remediation action, owner and closure evidence, or a formal risk acceptance.
  population_and_evidence_floor: 'Population: all in-scope AI use cases or activities in the period, drawn
    from the AI inventory. Evidence floor: fewer than 3 sampled items, or an inventory that cannot be
