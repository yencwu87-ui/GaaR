- framework: NIST AI RMF
  control_id: GOVERN 1.6
  title: Mechanisms are in place to inventory AI systems and are resourced according to organizational
    risk priorities.
  requirement: GOVERN 1.6
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should establish policies that define the creation and maintenance of AI system
      inventories.
    scope: model
    applies_when: null
    locator: controls.GOVERN 1.6.elements[0]
  - id: e2
    text: The organisation should establish policies that define a specific individual or team that is
      responsible for maintaining the inventory.
    scope: model
    applies_when: null
    locator: controls.GOVERN 1.6.elements[1]
  - id: e3
    text: The organisation should establish policies that define which models or systems are inventoried,
      with preference to inventorying all models or systems, or minimally, to high risk models or systems,
      or systems deployed in high-stakes settings.
    scope: model
    applies_when: null
    locator: controls.GOVERN 1.6.elements[2]
  boundary:
    none: no register, or a register with no unique identifier and no ownership.
    partial: a register exists and is structurally adequate, but completeness has not been reconciled
      against an independent source, or material staleness is present.
    full: the register is complete against an independent reconciliation, unique, owned and current, and
      sampled records trace to deployed reality.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 1
  test_of_design:
  - id: D1
    text: Obtain the register or inventory specification for Mechanisms are in place to inventory AI systems
      and are resourced according to organizational risk priorities — its required fields, unique identifier,
      ownership field, lifecycle status and retirement rule.
  - id: D2
    text: Confirm the specification defines what triggers a record being created, and at what point relative
      to first use, so completeness has a testable meaning.
  - id: D3
    text: Confirm the authoritative source and the reconciliation route used to prove the register is
      complete against the real estate.
  - id: D4
    text: Confirm update and attestation cadence, and who is accountable for accuracy.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold. PARTIALLY ADEQUATE when fields and ownership are
      defined but no completeness route exists. INADEQUATE when there is no unique identifier or no owner
      field. NOT TESTABLE when the specification is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the full register extract as at a stated date, with a record count.
  - id: O2
    text: 'Test completeness in the direction that can fail: reconcile from the independent source outward
      to the register, not register to itself. Use a deployment source, an access source or a cost or
      telemetry source.'
  - id: O3
    text: 'Test uniqueness and currency: duplicates, records with no owner, records whose status has not
      changed since creation, retired entries still active downstream.'
  - id: O4
    text: Sample records and trace each to real evidence of the thing it claims to describe.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when reconciliation finds no unregistered items and sampled records
      are accurate and current. PARTIALLY EFFECTIVE when the register is broadly accurate but stale or
      incomplete in places. INEFFECTIVE when unregistered production items are found. NOT TESTABLE when
      no independent source is available to reconcile against.'
  near_miss_failure_modes:
  - F1. Completeness is tested register-to-register — the register is reconciled to a list derived from
    itself, which can never find an omission.
  - F2. Every record was created on the same date, indicating a one-off population exercise rather than
    an operating process.
  - F3. Owner fields hold a team mailbox or a departed individual.
  - F4. Retired records remain in an active state downstream — decommissioned in the register but still
    holding credentials or serving traffic.
  - F5. The register captures models but not the prompts, tools or agents that change behaviour without
    a model change.
  resolutions:
  - failure_mode: F1
    text: A reconciliation from an independent source — deployment pipeline, identity provider, cost report
      or runtime telemetry — with exceptions listed.
  - failure_mode: F2
    text: Evidence of incremental record creation over the period, or an approved backfill with a completeness
      statement.
  - failure_mode: F3
    text: An ownership attestation naming current individuals, dated within the cadence.
  - failure_mode: F4
    text: A decommissioning record showing downstream revocation, not only the register status change.
  - failure_mode: F5
    text: A field set covering the components that can change behaviour, with at least one example populated.
  population_and_evidence_floor: 'Population: the full register extract plus the independent reconciliation
    source. Evidence floor: no independent source, or a register extract with no as-at date or record
    count, makes the completeness result NOT TESTABLE rather than PASS.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: GOVERN 1.7
  title: Processes and procedures are in place for decommissioning and phasing out AI systems safely and
    in a manner that does not increase risks or decrease the organization's trustworthiness.
  requirement: GOVERN 1.7
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: 'The organisation should establish policies for decommissioning AI systems. Such policies typically
      address:'
    scope: model
    applies_when: null
    locator: controls.GOVERN 1.7.elements[0]
  - id: e2
    text: The organisation should user and community concerns, and reputational risks.
    scope: model
    applies_when: null
    locator: controls.GOVERN 1.7.elements[1]
  - id: e3
    text: The organisation should business continuity and financial risks.
    scope: model
    applies_when: null
    locator: controls.GOVERN 1.7.elements[2]
  boundary:
    none: no change control over the AI artefacts, or production changes with no record.
    partial: change records exist but approval timing, approver authority, artefact versioning or post-implementation
      verification is not evidenced.
    full: every deployment reconciles to a record approved in advance by an authorised, independent approver,
      with the artefact versions named and the deployed state verified.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 9
  test_of_design:
  - id: D1
    text: Obtain the change or release procedure covering Processes and procedures are in place for decommissioning
      and phasing out AI systems safely and in a manner that does not increase risks or decrease the organization's
      trustworthiness — change classes, required approvals per class, testing gates and the record fields
      captured.
  - id: D2
    text: 'Confirm the record captures the AI-specific artefacts that change behaviour: model version,
      prompt or system-instruction version, tool or data-source configuration, and retrieval corpus where
      applicable.'
  - id: D3
    text: Confirm approval must precede implementation, and who may approve each class. Confirm the emergency
      route, its eligibility criteria and its retrospective approval window.
  - id: D4
    text: Confirm the rollback or reversion plan requirement and how it is validated.
  - id: D5
    text: Confirm post-implementation verification — that what is running is what was approved.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the procedure exists
      but omits AI-specific artefacts or post-implementation verification. INADEQUATE when approval is
      not required before implementation. NOT TESTABLE when the procedure is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population from the deployment source — the pipeline, release log or runtime history
      — not from the change register, so changes made without a record can be found.
  - id: O2
    text: Reconcile deployments to change records. Every deployment with no record is a finding.
  - id: O3
    text: Sample changes across classes including at least one emergency and one model or prompt version
      change. Compare approval timestamp to implementation timestamp.
  - id: O4
    text: Verify the approver was authorised for the class and is not the implementer.
  - id: O5
    text: Trace a sample to post-implementation verification, and any backed-out change to its rollback
      record.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when deployments reconcile to approved records, approvals precede
      implementation and verification occurred. PARTIALLY EFFECTIVE when records exist but timing, approver
      authority or verification is incomplete. INEFFECTIVE when unrecorded or unapproved production changes
      are found. NOT TESTABLE when the deployment population cannot be established independently.'
  near_miss_failure_modes:
  - F1. Approval timestamp is after the deployment timestamp — the record documents the change rather
    than authorising it.
  - F2. The approver is the implementer, or sits outside the approval matrix for that class.
  - F3. The emergency route carries a material share of all changes, with no incident reference behind
    them.
  - F4. The change names the service but not the model or prompt version, so the artefact that actually
    changed is invisible.
  - F5. A change freeze was in force and the change proceeded with no documented exemption.
  - F6. Privileged sessions used to implement are not recorded, or do not reconcile to the named implementer.
  - F7. No post-implementation verification, so a difference between the approved plan and the deployed
    state would never surface.
  resolutions:
  - failure_mode: F1
    text: A change record whose approval timestamp precedes deployment, or an approved retrospective acceptance
      naming the exposure.
  - failure_mode: F2
    text: An approval matrix and a record showing an approver drawn from it, distinct from the implementer.
  - failure_mode: F3
    text: An emergency change register with incident references and a rate that can be explained.
  - failure_mode: F4
    text: A change record field holding the model and prompt version, populated for a sampled change.
  - failure_mode: F5
    text: A freeze exemption approved at the level the freeze policy requires.
  - failure_mode: F6
    text: A privileged session record reconciling to the change and the named implementer.
  - failure_mode: F7
    text: A post-implementation verification record comparing running state to approved state.
  population_and_evidence_floor: 'Population: all production deployments in the period, established from
    the deployment pipeline or runtime history. Evidence floor: a population taken only from the change
    register cannot detect unrecorded change — report NOT TESTABLE for completeness in that case.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: GOVERN 2.1
  title: Roles and responsibilities and lines of communication related to mapping, measuring and managing
    AI risks are documented and are clear to individuals and teams throughout the organization.
  requirement: GOVERN 2.1
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should establish policies that define the AI risk management roles and responsibilities
      for positions directly and indirectly related to AI systems, including, but not limited to
    scope: model
    applies_when: null
    locator: controls.GOVERN 2.1.elements[0]
  - id: e2
    text: The organisation should boards of directors or advisory committees
    scope: model
    applies_when: null
    locator: controls.GOVERN 2.1.elements[1]
  - id: e3
    text: The organisation should senior management
    scope: model
    applies_when: null
    locator: controls.GOVERN 2.1.elements[2]
  boundary:
    none: no approved mandate, or a mandate that names no accountable body and no reserved decisions.
    partial: an approved mandate exists but one or more of decision rights, quorum, cadence or escalation
      thresholds is absent, or the body exists but material decisions are not traceable to it.
    full: mandate, reserved decision rights and reporting are approved and current, and material decisions
      in the period are attributable to the body with actions tracked.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play: []
  test_of_design:
  - id: D1
    text: Obtain the approved terms of reference, mandate or charter covering Roles and responsibilities
      and lines of communication related to mapping, measuring and managing AI risks are documented and
      are clear to individuals and teams throughout the organization, with its approval record and version
      history.
  - id: D2
    text: Confirm the mandate names the accountable role or body, its membership and quorum, and the decisions
      reserved to it rather than delegated to a model, a vendor or the delivery team.
  - id: D3
    text: Confirm reporting inputs, cadence, materiality thresholds for escalation and evidence-retention
      responsibilities are stated, not implied.
  - id: D4
    text: Confirm the mandate is current — reviewed within its stated cycle, and updated for any material
      change in AI scope since approval.
  - id: s5
    text: 'Design verdict: ADEQUATE only when D1-D3 all hold. PARTIALLY ADEQUATE when D1 holds and one
      of D2-D3 is incomplete. INADEQUATE when decision rights or accountability cannot be located. NOT
      TESTABLE when the authoritative mandate is not produced — absence of the artefact from the evidence
      pack is not a design failure until its absence is confirmed by the owner.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all meetings, decisions or approvals falling under the mandate in the
      review period. Establish the population from the calendar or register, not from the minutes supplied.'
  - id: O2
    text: Sample at least three meetings including every meeting at which a high-materiality matter was
      decided. Verify attendance against quorum.
  - id: O3
    text: 'Reperform: trace each sampled material AI matter to a recorded decision, a named decision-maker
      and a dated action, then trace open actions to closure or formal acceptance.'
  - id: O4
    text: Inspect any period in which the cadence was missed and the disposition of that gap.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when the body met at cadence, decided the material matters in
      scope, and actions were tracked. PARTIALLY EFFECTIVE when it operated but decisions or follow-up
      are incomplete. INEFFECTIVE when material matters bypassed the body. NOT TESTABLE when the population
      cannot be established.'
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than
    deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification
    date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not
    record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings
    without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved
    before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance
      naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period,
    established from the governance calendar or decision register. Evidence floor: fewer than 3 meetings
    or fewer than 1 material decision available to inspect makes the operating result NOT TESTABLE rather
    than a PASS.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: GOVERN 2.2
  title: The organization's personnel and partners receive AI risk management training to enable them
    to perform their duties and responsibilities consistent with related policies, procedures and agreements.
  requirement: GOVERN 2.2
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: 'The organisation should establish policies for personnel addressing ongoing education about:'
    scope: model
    applies_when: null
    locator: controls.GOVERN 2.2.elements[0]
  - id: e2
    text: The organisation should applicable laws and regulations for AI systems.
    scope: model
    applies_when: null
    locator: controls.GOVERN 2.2.elements[1]
  - id: e3
    text: The organisation should potential negative impacts that may arise from AI systems.
    scope: model
    applies_when: null
    locator: controls.GOVERN 2.2.elements[2]
  boundary:
    none: no approved policy, or a document with no owner and no scope.
    partial: an approved policy exists but lacks an exception route, an implementing control, or sampled
      activity does not consistently follow it.
    full: the policy is approved, current, scoped, owned, implemented by a named control, and sampled
      activity follows it with exceptions governed.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play: []
  test_of_design:
  - id: D1
    text: Obtain the approved policy or standard covering The organization's personnel and partners receive
      AI risk management training to enable them to perform their duties and responsibilities consistent
      with related policies, procedures and agreements, with its approval record, owner and version history.
  - id: D2
    text: Confirm it states scope (which systems, models and uses it binds), prohibited and controlled
      uses, the accountable owner and the consequence of non-compliance.
  - id: D3
    text: Confirm it defines the exception route — who may grant one, on what basis, for how long, and
      where exceptions are recorded.
  - id: D4
    text: Confirm the review cycle and the triggers for out-of-cycle review, and that the document is
      within its cycle.
  - id: D5
    text: Confirm the policy is mapped to the controls, plays or procedures that implement it, so a requirement
      is not left with nothing that operates it.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D5 identifies at least one implementing control.
      PARTIALLY ADEQUATE when the policy exists but the exception route or implementing link is absent.
      INADEQUATE when scope or ownership is undefined. NOT TESTABLE when the approved document is not
      produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: AI use cases, systems or activities in scope of the policy during the
      period, taken from the AI inventory rather than from a list supplied by the assessed team.'
  - id: O2
    text: Sample across materiality tiers and include at least one use case that went live in the period.
  - id: O3
    text: 'Reperform: verify each sampled item was assessed against the policy at the required point,
      and that any required attestation or approval exists and predates the activity.'
  - id: O4
    text: Inspect the exception and breach records for the period — verify each is dated, owned, time-bound
      and dispositioned.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when sampled use follows the approved policy and exceptions are
      governed. PARTIALLY EFFECTIVE when compliance is inconsistent or exceptions are open past expiry.
      INEFFECTIVE when the policy was bypassed for material use. NOT TESTABLE when the in-scope population
      cannot be established.'
  near_miss_failure_modes:
  - F1. The policy is approved but has no implementing procedure — nothing in the operating environment
    makes the requirement happen.
  - F2. Scope is written so broadly ('all AI use') that no one can tell whether a given system is in or
    out.
  - F3. Exceptions are granted by the same team that needs them, with no expiry.
  - F4. The policy was approved in the period but the sampled use cases predate it and were never reassessed
    against it.
  - F5. A breach register exists but every entry is closed as 'noted' with no remediation or acceptance.
  resolutions:
  - failure_mode: F1
    text: A named procedure, runbook or control that implements the clause, with an owner.
  - failure_mode: F2
    text: A scope statement with inclusion and exclusion criteria, or a mapping from the inventory to
      in-scope flag.
  - failure_mode: F3
    text: An exception record showing an independent grantor, a stated basis and an expiry date.
  - failure_mode: F4
    text: A reassessment record for pre-existing use cases, or an approved grandfathering decision.
  - failure_mode: F5
    text: A breach entry with a remediation action, owner and closure evidence, or a formal risk acceptance.
  population_and_evidence_floor: 'Population: all in-scope AI use cases or activities in the period, drawn
    from the AI inventory. Evidence floor: fewer than 3 sampled items, or an inventory that cannot be
    reconciled, makes the operating result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
