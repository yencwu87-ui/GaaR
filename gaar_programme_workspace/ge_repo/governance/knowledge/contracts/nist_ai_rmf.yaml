  - id: O4
    text: Where competence is assessed, inspect the assessment and the pass standard.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when the in-scope population is complete and non-completions are
      dispositioned. PARTIALLY EFFECTIVE when completion is high but the population is drawn from the
      training system itself. INEFFECTIVE when decision-holding roles are untrained. NOT TESTABLE when
      the population cannot be established independently.'
  near_miss_failure_modes:
  - F1. Completion is 100% of enrolled, and enrolment omitted part of the in-scope population.
  - F2. Training is generic AI awareness while the role's decisions require specific control knowledge.
  - F3. Joiners completed training months after taking on the reviewing authority.
  - F4. Completion is attendance with no assessment, so competence is assumed.
  - F5. Non-completion carries a stated consequence that has never been applied.
  resolutions:
  - failure_mode: F1
    text: A reconciliation from HR or entitlement data to the training roster.
  - failure_mode: F2
    text: A content outline mapped to the role's decisions.
  - failure_mode: F3
    text: Completion dates compared to role start dates.
  - failure_mode: F4
    text: An assessment with a pass standard and results.
  - failure_mode: F5
    text: Evidence of the consequence being applied, or an approved exception.
  population_and_evidence_floor: 'Population: in-scope roles from HR or entitlement data. Evidence floor:
    a population taken from the training system roster cannot detect an omitted person — report NOT TESTABLE
    for completeness.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: GOVERN 3.2
  title: Policies and procedures are in place to define and differentiate roles and responsibilities for
    human-AI configurations and oversight of AI systems.
  requirement: GOVERN 3.2
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should establish policies and procedures that define and differentiate the
      various human roles and responsibilities when using, interacting with, or monitoring AI systems.
    scope: model
    applies_when: null
    locator: controls.GOVERN 3.2.elements[0]
  - id: e2
    text: The organisation should establish procedures for capturing and tracking risk information related
      to human-AI configurations and associated outcomes.
    scope: model
    applies_when: null
    locator: controls.GOVERN 3.2.elements[1]
  - id: e3
    text: The organisation should establish policies for the development of proficiency standards for
      AI actors carrying out system operation tasks and system oversight tasks.
    scope: model
    applies_when: null
    locator: controls.GOVERN 3.2.elements[2]
  boundary:
    none: no approved mandate, or a mandate that names no accountable body and no reserved decisions.
    partial: an approved mandate exists but one or more of decision rights, quorum, cadence or escalation
      thresholds is absent, or the body exists but material decisions are not traceable to it.
    full: mandate, reserved decision rights and reporting are approved and current, and material decisions
      in the period are attributable to the body with actions tracked.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play: []
  test_of_design:
  - id: D1
    text: Obtain the approved terms of reference, mandate or charter covering Policies and procedures
      are in place to define and differentiate roles and responsibilities for human-AI configurations
      and oversight of AI systems, with its approval record and version history.
  - id: D2
    text: Confirm the mandate names the accountable role or body, its membership and quorum, and the decisions
      reserved to it rather than delegated to a model, a vendor or the delivery team.
  - id: D3
    text: Confirm reporting inputs, cadence, materiality thresholds for escalation and evidence-retention
      responsibilities are stated, not implied.
  - id: D4
    text: Confirm the mandate is current — reviewed within its stated cycle, and updated for any material
      change in AI scope since approval.
  - id: s5
    text: 'Design verdict: ADEQUATE only when D1-D3 all hold. PARTIALLY ADEQUATE when D1 holds and one
      of D2-D3 is incomplete. INADEQUATE when decision rights or accountability cannot be located. NOT
      TESTABLE when the authoritative mandate is not produced — absence of the artefact from the evidence
      pack is not a design failure until its absence is confirmed by the owner.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all meetings, decisions or approvals falling under the mandate in the
      review period. Establish the population from the calendar or register, not from the minutes supplied.'
  - id: O2
    text: Sample at least three meetings including every meeting at which a high-materiality matter was
      decided. Verify attendance against quorum.
  - id: O3
    text: 'Reperform: trace each sampled material AI matter to a recorded decision, a named decision-maker
      and a dated action, then trace open actions to closure or formal acceptance.'
  - id: O4
    text: Inspect any period in which the cadence was missed and the disposition of that gap.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when the body met at cadence, decided the material matters in
      scope, and actions were tracked. PARTIALLY EFFECTIVE when it operated but decisions or follow-up
      are incomplete. INEFFECTIVE when material matters bypassed the body. NOT TESTABLE when the population
      cannot be established.'
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than
    deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification
    date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not
    record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings
    without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved
    before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance
      naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period,
    established from the governance calendar or decision register. Evidence floor: fewer than 3 meetings
    or fewer than 1 material decision available to inspect makes the operating result NOT TESTABLE rather
    than a PASS.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: GOVERN 4.1
  title: Organizational policies and practices are in place to foster a critical thinking and safety-first
    mindset in the design, development, deployment, and uses of AI systems to minimize potential negative
    impacts.
  requirement: GOVERN 4.1
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should establish policies that require inclusion of oversight functions (legal,
      compliance, risk management) from the outset of the system design process.
    scope: model
    applies_when: null
    locator: controls.GOVERN 4.1.elements[0]
  - id: e2
    text: The organisation should establish policies that promote effective challenge of AI system design,
      implementation, and deployment decisions, via mechanisms such as the three lines of defense, model
      audits, or red-teaming - to minimize workplace risks such as groupthink.
    scope: model
    applies_when: null
    locator: controls.GOVERN 4.1.elements[1]
  - id: e3
    text: The organisation should establish policies that incentivize safety-first mindset and general
      critical thinking and review at an organizational and procedural level.
    scope: model
    applies_when: null
    locator: controls.GOVERN 4.1.elements[2]
  boundary:
    none: no approved policy, or a document with no owner and no scope.
    partial: an approved policy exists but lacks an exception route, an implementing control, or sampled
      activity does not consistently follow it.
    full: the policy is approved, current, scoped, owned, implemented by a named control, and sampled
      activity follows it with exceptions governed.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play: []
  test_of_design:
  - id: D1
    text: Obtain the approved policy or standard covering Organizational policies and practices are in
      place to foster a critical thinking and safety-first mindset in the design, development, deployment,
      and uses of AI systems to minimize potential negative impacts, with its approval record, owner and
      version history.
  - id: D2
    text: Confirm it states scope (which systems, models and uses it binds), prohibited and controlled
      uses, the accountable owner and the consequence of non-compliance.
  - id: D3
    text: Confirm it defines the exception route — who may grant one, on what basis, for how long, and
      where exceptions are recorded.
  - id: D4
    text: Confirm the review cycle and the triggers for out-of-cycle review, and that the document is
      within its cycle.
  - id: D5
    text: Confirm the policy is mapped to the controls, plays or procedures that implement it, so a requirement
      is not left with nothing that operates it.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D5 identifies at least one implementing control.
      PARTIALLY ADEQUATE when the policy exists but the exception route or implementing link is absent.
      INADEQUATE when scope or ownership is undefined. NOT TESTABLE when the approved document is not
      produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: AI use cases, systems or activities in scope of the policy during the
      period, taken from the AI inventory rather than from a list supplied by the assessed team.'
  - id: O2
    text: Sample across materiality tiers and include at least one use case that went live in the period.
  - id: O3
    text: 'Reperform: verify each sampled item was assessed against the policy at the required point,
      and that any required attestation or approval exists and predates the activity.'
  - id: O4
    text: Inspect the exception and breach records for the period — verify each is dated, owned, time-bound
      and dispositioned.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when sampled use follows the approved policy and exceptions are
      governed. PARTIALLY EFFECTIVE when compliance is inconsistent or exceptions are open past expiry.
      INEFFECTIVE when the policy was bypassed for material use. NOT TESTABLE when the in-scope population
      cannot be established.'
  near_miss_failure_modes:
  - F1. The policy is approved but has no implementing procedure — nothing in the operating environment
    makes the requirement happen.
  - F2. Scope is written so broadly ('all AI use') that no one can tell whether a given system is in or
    out.
  - F3. Exceptions are granted by the same team that needs them, with no expiry.
  - F4. The policy was approved in the period but the sampled use cases predate it and were never reassessed
    against it.
  - F5. A breach register exists but every entry is closed as 'noted' with no remediation or acceptance.
  resolutions:
  - failure_mode: F1
    text: A named procedure, runbook or control that implements the clause, with an owner.
  - failure_mode: F2
    text: A scope statement with inclusion and exclusion criteria, or a mapping from the inventory to
      in-scope flag.
  - failure_mode: F3
    text: An exception record showing an independent grantor, a stated basis and an expiry date.
  - failure_mode: F4
    text: A reassessment record for pre-existing use cases, or an approved grandfathering decision.
  - failure_mode: F5
    text: A breach entry with a remediation action, owner and closure evidence, or a formal risk acceptance.
  population_and_evidence_floor: 'Population: all in-scope AI use cases or activities in the period, drawn
    from the AI inventory. Evidence floor: fewer than 3 sampled items, or an inventory that cannot be
    reconciled, makes the operating result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: GOVERN 4.2
  title: Organizational teams document the risks and potential impacts of the AI technology they design,
    develop, deploy, evaluate and use, and they communicate about the impacts more broadly.
  requirement: GOVERN 4.2
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should establish impact assessment policies and processes for AI systems used
      by the organization.
    scope: model
    applies_when: null
    locator: controls.GOVERN 4.2.elements[0]
  - id: e2
    text: The organisation should align organizational impact assessment activities with relevant regulatory
      or legal requirements.
    scope: model
    applies_when: null
    locator: controls.GOVERN 4.2.elements[1]
  - id: e3
    text: The organisation should verify that impact assessment activities are appropriate to evaluate
      the potential negative impact of a system and how quickly a system changes, and that assessments
      are applied on a regular basis.
    scope: model
    applies_when: null
    locator: controls.GOVERN 4.2.elements[2]
  boundary:
    none: no methodology, or assessments performed with no criteria.
    partial: a methodology exists and is used, but timing, independence, threshold discipline or reassessment
      is not evidenced.
    full: assessments are complete, timely, independent of the requester, reperformable from the recorded
      facts, and drive the controls their outcome obliges.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play: []
  test_of_design:
  - id: D1
    text: Obtain the approved methodology and template for Organizational teams document the risks and
      potential impacts of the AI technology they design, develop, deploy, evaluate and use, and they
      communicate about the impacts more broadly — trigger, criteria, scoring or classification scheme,
      and the decision each outcome drives.
  - id: D2
    text: 'Confirm the criteria are discriminating: different inputs produce different outcomes, and the
      thresholds between tiers are stated numerically or by defined rule rather than by judgement alone.'
  - id: D3
    text: Confirm the assessment must be completed before the decision it informs, and who approves the
      outcome.
  - id: D4
    text: Confirm reassessment triggers — material change, incident, elapsed time — and who is accountable
      for detecting them.
  - id: D5
    text: 'Confirm what an outcome obliges: which controls a tier turns on, so classification is load-bearing
      rather than descriptive.'
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the method exists
      but thresholds or consequences are undefined. INADEQUATE when outcomes drive nothing. NOT TESTABLE
      when the approved methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all use cases requiring an assessment in the period, taken from the
      inventory or intake log.'
  - id: O2
    text: Sample across tiers, including at least one that was classified into the lowest tier — the classification
      most likely to be wrong and least likely to be challenged.
  - id: O3
    text: Reperform the classification from the underlying facts and compare to the recorded outcome.
      A reperformance that disagrees is a finding regardless of the approver's seniority.
  - id: O4
    text: 'Verify timing: the assessment date precedes the decision date. Verify reassessment where a
      trigger occurred.'
  - id: s5
    text: 'Operating verdict: EFFECTIVE when reperformance agrees, timing holds and triggers were acted
      on. PARTIALLY EFFECTIVE when assessments are complete but late, or a low-tier outcome cannot be
      supported. INEFFECTIVE when assessments are missing for material use or systematically under-tier.
      NOT TESTABLE when the population of in-scope use cases cannot be established.'
  near_miss_failure_modes:
  - F1. Every use case lands in the same tier, which means the scheme is not discriminating or is being
    applied to reach a pre-decided answer.
  - F2. The assessment is dated after the go-live date, so it documented a decision rather than informing
    it.
  - F3. The assessor and the requester are the same person or the same team.
  - F4. A low-tier classification rests on a scope statement that excludes the risky part of the system
    — for example classifying a copilot as advisory while it writes to a system of record.
  - F5. Reassessment triggers exist on paper but no reassessment occurred despite a material model or
    vendor change in the period.
  resolutions:
  - failure_mode: F1
    text: A tier distribution across the population, with the rationale for outliers in either direction.
  - failure_mode: F2
    text: An assessment record dated before the approval or go-live date, or a documented retrospective
      acceptance.
  - failure_mode: F3
    text: An approval by a role outside the delivery team, named in the record.
  - failure_mode: F4
    text: A scope statement that enumerates the system's write paths and downstream effects, reassessed
      on that basis.
  - failure_mode: F5
    text: A reassessment record tied to the change that triggered it.
  population_and_evidence_floor: 'Population: all use cases requiring assessment in the period, from the
    intake log or AI inventory. Evidence floor: fewer than 3 assessments, or no sample from the lowest
    tier, makes the operating result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: GOVERN 4.3
  title: Organizational practices are in place to enable AI testing, identification of incidents, and
    information sharing.
  requirement: GOVERN 4.3
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should establish policies and procedures to facilitate and equip AI system
      testing.
    scope: model
    applies_when: null
    locator: controls.GOVERN 4.3.elements[0]
  - id: e2
    text: The organisation should establish organizational commitment to identifying AI system limitations
      and sharing of insights about limitations within appropriate AI actor groups.
    scope: model
    applies_when: null
    locator: controls.GOVERN 4.3.elements[1]
  - id: e3
    text: The organisation should establish policies for reporting and documenting incident response.
    scope: model
    applies_when: null
    locator: controls.GOVERN 4.3.elements[2]
  boundary:
    none: no validation, or a report with no acceptance criteria and no independence.
    partial: validation was performed but is stale against the deployed version, not independent, or thresholds
      and shortfall disposition are not evidenced.
    full: the deployed version was independently validated against pre-stated thresholds, with retained
      results and every shortfall remediated or formally accepted.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 6
  test_of_design:
  - id: D1
    text: Obtain the approved validation or evaluation methodology for Organizational practices are in
      place to enable AI testing, identification of incidents, and information sharing — scope, test types,
      datasets, metrics and acceptance thresholds.
  - id: D2
    text: Confirm acceptance thresholds are stated in advance of testing and are specific to the use case
      rather than generic.
  - id: D3
    text: 'Confirm independence: who performs the validation and how they are separated from the team
      that built the system.'
  - id: D4
    text: Confirm the methodology covers the failure modes the system can actually produce, including
      the ones a benchmark score does not capture.
  - id: D5
    text: Confirm the disposition rule — what happens when a threshold is missed, and who may accept a
      shortfall.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when tests are defined
      but thresholds are set after results, or independence is unclear. INADEQUATE when no acceptance
      criterion exists. NOT TESTABLE when the methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: every model, prompt or agent version promoted in the period.'
  - id: O2
    text: For a sample, obtain the validation report and check it covers the version actually deployed
      — compare version identifiers and dates, not titles.
  - id: O3
    text: Reperform or recompute at least one reported metric from the underlying results where the data
      permits.
  - id: O4
    text: Trace every shortfall against threshold to a remediation, a re-test or an approved acceptance
      by a role with authority to grant it.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when each deployed version has independent validation against
      pre-stated thresholds and shortfalls are dispositioned. PARTIALLY EFFECTIVE when validation exists
      but is stale, non-independent or partly unevidenced. INEFFECTIVE when versions reached production
      unvalidated. NOT TESTABLE when the version population or the underlying results are unavailable.'
  near_miss_failure_modes:
  - F1. The validation report predates the deployed version — it validates the model that was tested,
    not the one that is running.
  - F2. The validator sits in the same reporting line as the builder, so 'independent review' is a signature
    rather than a challenge.
  - F3. The acceptance threshold was chosen after the result was known, which makes a pass unfalsifiable.
  - F4. The test set overlaps the tuning or training data, so the reported score measures memorisation.
  - F5. A metric is reported with no sample size, so a favourable number may rest on a handful of cases.
  - F6. Only aggregate performance is reported — no slice, subgroup or worst-case analysis where the control
    requires it.
  resolutions:
  - failure_mode: F1
    text: A validation report whose version identifier matches the deployed artefact, or a re-validation
      of the current version.
  - failure_mode: F2
    text: A validation performed or signed by a function outside the delivery reporting line, with the
      reviewer named.
  - failure_mode: F3
    text: A pre-registered threshold — an approved test plan dated before the test run.
  - failure_mode: F4
    text: A statement of dataset provenance and separation, or a held-out set with documented construction.
  - failure_mode: F5
    text: Reported metrics with denominators and confidence, or the underlying result file.
  - failure_mode: F6
    text: Slice-level results for the populations the control names.
  population_and_evidence_floor: 'Population: all model, prompt or agent versions promoted in the period.
    Evidence floor: fewer than 1 validated version in the period, or reports with no version identifier,
    makes the operating result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
