    locator: controls.MEASURE 4.3.elements[0]
  - id: e2
    text: The organisation should delimit and characterize baseline operation values and states.
    scope: model
    applies_when: null
    locator: controls.MEASURE 4.3.elements[1]
  - id: e3
    text: The organisation should utilize qualitative approaches to augment and complement quantitative
      baseline measures, in close coordination with impact assessment, human factors and sociotechnical
      AI actors.
    scope: model
    applies_when: null
    locator: controls.MEASURE 4.3.elements[2]
  boundary:
    none: no monitoring, or monitoring with no thresholds and no owner.
    partial: monitoring is configured and running but coverage, alert disposition or detector assurance
      is incomplete, or the metrics are proxies for the risk rather than the risk.
    full: approved metrics ran continuously, alerts were owned and dispositioned, and the detector is
      demonstrably capable of firing.
  owner: Indep. Validation / InfoSec
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play: []
  test_of_design:
  - id: D1
    text: Obtain the monitoring design for Measurable performance improvements or declines based on consultations
      with relevant AI actors, including affected communities, and field data about context-relevant risks
      and trustworthiness characteristics are identified and documented — the metrics, their thresholds,
      the observation window and the alerting route.
  - id: D2
    text: Confirm the metrics correspond to the failure the control exists to catch, not only to availability
      or infrastructure health.
  - id: D3
    text: Confirm each alert has a named recipient, a required response time and a disposition record.
  - id: D4
    text: Confirm how the detector itself is validated — how anyone knows an alert would fire if the condition
      occurred.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D4 identifies a test route. PARTIALLY ADEQUATE
      when metrics and thresholds exist but ownership or detector assurance is absent. INADEQUATE when
      thresholds are undefined. NOT TESTABLE when the monitoring configuration is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the monitoring output for the full period, with coverage gaps identified — periods with
      no data are findings, not blanks.
  - id: O2
    text: Verify the configuration in force matches the approved design, read from the running configuration
      rather than from a document.
  - id: O3
    text: Sample alerts raised and trace each to an owner, a response within the stated time and a disposition.
  - id: O4
    text: Where no alert fired in the period, test the detector — a synthetic breach, a back-test against
      a known past event, or an equivalent.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when monitoring ran continuously against the approved thresholds
      and alerts were dispositioned. PARTIALLY EFFECTIVE when coverage gaps exist or alerts closed without
      disposition. INEFFECTIVE when monitoring was not operating or breaches were not acted on. NOT TESTABLE
      when monitoring output for the period is unavailable.'
  near_miss_failure_modes:
  - F1. No alert fired all period and this is presented as evidence of health, with nothing showing the
    detector works.
  - F2. Thresholds in the running configuration differ from the approved design, usually loosened after
    a noisy week.
  - F3. Alerts are routed to a shared channel with no named owner, and closure is by silence.
  - F4. Monitoring covers latency and uptime while the control is about model quality, drift or mandate
    breach.
  - F5. Coverage has gaps that coincide with the periods of highest change.
  - F6. Drift is monitored on inputs only, with no monitoring of the outcome the model drives.
  resolutions:
  - failure_mode: F1
    text: A detector test, synthetic breach or back-test against a known past event.
  - failure_mode: F2
    text: An export of the running configuration compared to the approved baseline, with any deviation
      approved.
  - failure_mode: F3
    text: An alert record naming a recipient, a response time and a disposition.
  - failure_mode: F4
    text: A metric definition tied to the control objective, with at least one period of output.
  - failure_mode: F5
    text: A continuous coverage statement with gaps explained and dispositioned.
  - failure_mode: F6
    text: Output-side monitoring covering the decisions or actions the system produced.
  population_and_evidence_floor: 'Population: the full monitoring period, plus all alerts raised. Evidence
    floor: no alerts in the period and no detector test means silence is uninformative — report NOT TESTABLE
    rather than PASS.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: MANAGE 1.1
  title: A determination is made as to whether the AI system achieves its intended purposes and stated
    objectives and whether its development or deployment should proceed.
  requirement: MANAGE 1.1
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should consider trustworthiness characteristics when evaluating AI systems'
      negative risks and benefits.
    scope: model
    applies_when: null
    locator: controls.MANAGE 1.1.elements[0]
  - id: e2
    text: The organisation should utilize TEVV outputs from map and measure functions when considering
      risk treatment.
    scope: model
    applies_when: null
    locator: controls.MANAGE 1.1.elements[1]
  - id: e3
    text: The organisation should regularly track and monitor negative risks and benefits throughout the
      AI system lifecycle including in post-deployment monitoring.
    scope: model
    applies_when: null
    locator: controls.MANAGE 1.1.elements[2]
  boundary:
    none: no change control over the AI artefacts, or production changes with no record.
    partial: change records exist but approval timing, approver authority, artefact versioning or post-implementation
      verification is not evidenced.
    full: every deployment reconciles to a record approved in advance by an authorised, independent approver,
      with the artefact versions named and the deployed state verified.
  owner: Model Owner + AI Risk
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 4, 10
  test_of_design:
  - id: D1
    text: Obtain the change or release procedure covering A determination is made as to whether the AI
      system achieves its intended purposes and stated objectives and whether its development or deployment
      should proceed — change classes, required approvals per class, testing gates and the record fields
      captured.
  - id: D2
    text: 'Confirm the record captures the AI-specific artefacts that change behaviour: model version,
      prompt or system-instruction version, tool or data-source configuration, and retrieval corpus where
      applicable.'
  - id: D3
    text: Confirm approval must precede implementation, and who may approve each class. Confirm the emergency
      route, its eligibility criteria and its retrospective approval window.
  - id: D4
    text: Confirm the rollback or reversion plan requirement and how it is validated.
  - id: D5
    text: Confirm post-implementation verification — that what is running is what was approved.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the procedure exists
      but omits AI-specific artefacts or post-implementation verification. INADEQUATE when approval is
      not required before implementation. NOT TESTABLE when the procedure is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population from the deployment source — the pipeline, release log or runtime history
      — not from the change register, so changes made without a record can be found.
  - id: O2
    text: Reconcile deployments to change records. Every deployment with no record is a finding.
  - id: O3
    text: Sample changes across classes including at least one emergency and one model or prompt version
      change. Compare approval timestamp to implementation timestamp.
  - id: O4
    text: Verify the approver was authorised for the class and is not the implementer.
  - id: O5
    text: Trace a sample to post-implementation verification, and any backed-out change to its rollback
      record.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when deployments reconcile to approved records, approvals precede
      implementation and verification occurred. PARTIALLY EFFECTIVE when records exist but timing, approver
      authority or verification is incomplete. INEFFECTIVE when unrecorded or unapproved production changes
      are found. NOT TESTABLE when the deployment population cannot be established independently.'
  near_miss_failure_modes:
  - F1. Approval timestamp is after the deployment timestamp — the record documents the change rather
    than authorising it.
  - F2. The approver is the implementer, or sits outside the approval matrix for that class.
  - F3. The emergency route carries a material share of all changes, with no incident reference behind
    them.
  - F4. The change names the service but not the model or prompt version, so the artefact that actually
    changed is invisible.
  - F5. A change freeze was in force and the change proceeded with no documented exemption.
  - F6. Privileged sessions used to implement are not recorded, or do not reconcile to the named implementer.
  - F7. No post-implementation verification, so a difference between the approved plan and the deployed
    state would never surface.
  resolutions:
  - failure_mode: F1
    text: A change record whose approval timestamp precedes deployment, or an approved retrospective acceptance
      naming the exposure.
  - failure_mode: F2
    text: An approval matrix and a record showing an approver drawn from it, distinct from the implementer.
  - failure_mode: F3
    text: An emergency change register with incident references and a rate that can be explained.
  - failure_mode: F4
    text: A change record field holding the model and prompt version, populated for a sampled change.
  - failure_mode: F5
    text: A freeze exemption approved at the level the freeze policy requires.
  - failure_mode: F6
    text: A privileged session record reconciling to the change and the named implementer.
  - failure_mode: F7
    text: A post-implementation verification record comparing running state to approved state.
  population_and_evidence_floor: 'Population: all production deployments in the period, established from
    the deployment pipeline or runtime history. Evidence floor: a population taken only from the change
    register cannot detect unrecorded change — report NOT TESTABLE for completeness in that case.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: MANAGE 1.2
  title: Treatment of documented AI risks is prioritized based on impact, likelihood and available resources
    or methods.
  requirement: MANAGE 1.2
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should assign risk management resources relative to established risk tolerance.
      AI systems with lower risk tolerances receive greater oversight, mitigation and management resources.
    scope: model
    applies_when: null
    locator: controls.MANAGE 1.2.elements[0]
  - id: e2
    text: The organisation should document AI risk tolerance determination practices and resource decisions.
    scope: model
    applies_when: null
    locator: controls.MANAGE 1.2.elements[1]
  - id: e3
    text: The organisation should regularly review risk tolerances and re-calibrate, as needed, in accordance
      with information from AI system monitoring and assessment .
    scope: model
    applies_when: null
    locator: controls.MANAGE 1.2.elements[2]
  boundary:
    none: no methodology, or assessments performed with no criteria.
    partial: a methodology exists and is used, but timing, independence, threshold discipline or reassessment
      is not evidenced.
    full: assessments are complete, timely, independent of the requester, reperformable from the recorded
      facts, and drive the controls their outcome obliges.
  owner: Model Owner + AI Risk
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 10
  test_of_design:
  - id: D1
    text: Obtain the approved methodology and template for Treatment of documented AI risks is prioritized
      based on impact, likelihood and available resources or methods — trigger, criteria, scoring or classification
      scheme, and the decision each outcome drives.
  - id: D2
    text: 'Confirm the criteria are discriminating: different inputs produce different outcomes, and the
      thresholds between tiers are stated numerically or by defined rule rather than by judgement alone.'
  - id: D3
    text: Confirm the assessment must be completed before the decision it informs, and who approves the
      outcome.
  - id: D4
    text: Confirm reassessment triggers — material change, incident, elapsed time — and who is accountable
      for detecting them.
  - id: D5
    text: 'Confirm what an outcome obliges: which controls a tier turns on, so classification is load-bearing
      rather than descriptive.'
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the method exists
      but thresholds or consequences are undefined. INADEQUATE when outcomes drive nothing. NOT TESTABLE
      when the approved methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all use cases requiring an assessment in the period, taken from the
      inventory or intake log.'
  - id: O2
    text: Sample across tiers, including at least one that was classified into the lowest tier — the classification
      most likely to be wrong and least likely to be challenged.
  - id: O3
    text: Reperform the classification from the underlying facts and compare to the recorded outcome.
      A reperformance that disagrees is a finding regardless of the approver's seniority.
  - id: O4
    text: 'Verify timing: the assessment date precedes the decision date. Verify reassessment where a
      trigger occurred.'
  - id: s5
    text: 'Operating verdict: EFFECTIVE when reperformance agrees, timing holds and triggers were acted
      on. PARTIALLY EFFECTIVE when assessments are complete but late, or a low-tier outcome cannot be
      supported. INEFFECTIVE when assessments are missing for material use or systematically under-tier.
      NOT TESTABLE when the population of in-scope use cases cannot be established.'
  near_miss_failure_modes:
  - F1. Every use case lands in the same tier, which means the scheme is not discriminating or is being
    applied to reach a pre-decided answer.
  - F2. The assessment is dated after the go-live date, so it documented a decision rather than informing
    it.
  - F3. The assessor and the requester are the same person or the same team.
  - F4. A low-tier classification rests on a scope statement that excludes the risky part of the system
    — for example classifying a copilot as advisory while it writes to a system of record.
  - F5. Reassessment triggers exist on paper but no reassessment occurred despite a material model or
    vendor change in the period.
  resolutions:
  - failure_mode: F1
    text: A tier distribution across the population, with the rationale for outliers in either direction.
  - failure_mode: F2
    text: An assessment record dated before the approval or go-live date, or a documented retrospective
      acceptance.
  - failure_mode: F3
    text: An approval by a role outside the delivery team, named in the record.
  - failure_mode: F4
    text: A scope statement that enumerates the system's write paths and downstream effects, reassessed
      on that basis.
  - failure_mode: F5
    text: A reassessment record tied to the change that triggered it.
  population_and_evidence_floor: 'Population: all use cases requiring assessment in the period, from the
    intake log or AI inventory. Evidence floor: fewer than 3 assessments, or no sample from the lowest
    tier, makes the operating result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
