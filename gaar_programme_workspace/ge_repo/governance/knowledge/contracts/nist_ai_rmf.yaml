- framework: NIST AI RMF
  control_id: MANAGE 3.1
  title: AI risks and benefits from third-party resources are regularly monitored, and risk controls are
    applied and documented.
  requirement: MANAGE 3.1
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should have legal requirements been addressed?
    scope: model
    applies_when: null
    locator: controls.MANAGE 3.1.elements[0]
  - id: e2
    text: The organisation should apply organizational risk tolerance to third-party AI systems.
    scope: model
    applies_when: null
    locator: controls.MANAGE 3.1.elements[1]
  - id: e3
    text: The organisation should apply and document organizational risk management plans and practices
      to third-party AI technology, personnel, or other resources.
    scope: model
    applies_when: null
    locator: controls.MANAGE 3.1.elements[2]
  boundary:
    none: no third-party assessment for AI providers, or providers in production with no assessment.
    partial: onboarding diligence occurred but contractual rights, sub-processor scope or ongoing oversight
      is not evidenced.
    full: assessments preceded use, required clauses are present in executed contracts, and ongoing oversight
      operated with findings dispositioned.
  owner: Model Owner + AI Risk
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 7
  test_of_design:
  - id: D1
    text: Obtain the third-party requirements covering AI risks and benefits from third-party resources
      are regularly monitored, and risk controls are applied and documented — the due-diligence scope,
      the contractual clauses required and the approval route before onboarding.
  - id: D2
    text: Confirm the due diligence covers what the provider does with the institution's data, the provider's
      own model change practice, and its notification obligations on material change or incident.
  - id: D3
    text: 'Confirm contractual rights: audit or assurance report access, notification periods, exit and
      transition, and liability for model behaviour.'
  - id: D4
    text: Confirm the ongoing obligation — reassessment cadence, performance monitoring and the trigger
      for re-approval.
  - id: D5
    text: Confirm the treatment of sub-processors and of models embedded in a purchased product, where
      the AI is not the thing being bought.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when diligence is defined but
      ongoing obligations or embedded-AI treatment is absent. INADEQUATE when no pre-onboarding assessment
      is required. NOT TESTABLE when the requirements are not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of AI-relevant third parties in the period from procurement or vendor-management
      data, including products with embedded AI, not only AI vendors.
  - id: O2
    text: Sample and verify a completed assessment dated before contract signature or before first production
      use.
  - id: O3
    text: Verify the required clauses are present in the executed contract, read from the contract rather
      than the checklist.
  - id: O4
    text: Verify ongoing obligations operated — reassessment at cadence, assurance reports obtained and
      reviewed with findings dispositioned, and provider change notifications acted on.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when assessments preceded use, clauses are present and ongoing
      obligations ran. PARTIALLY EFFECTIVE when onboarding was controlled but ongoing oversight is unevidenced.
      INEFFECTIVE when material providers were onboarded unassessed. NOT TESTABLE when the vendor population
      cannot be established.'
  near_miss_failure_modes:
  - F1. The provider was assessed as a software vendor before the AI feature was enabled, and never reassessed
    when it was.
  - F2. The assessment is dated after contract signature, so it recorded a decision already taken.
  - F3. The contract references an assurance report that was never obtained, or one that excludes the
    AI component from scope.
  - F4. Sub-processors are named in the provider's terms but were never assessed.
  - F5. Provider change notifications arrive but there is no route by which they reach the control owner.
  - F6. The provider's own model changes silently under a continuously updated service, with no version
    pinning and no notification right.
  resolutions:
  - failure_mode: F1
    text: A reassessment triggered by the AI feature being enabled.
  - failure_mode: F2
    text: An assessment record dated before signature, or an approved exception.
  - failure_mode: F3
    text: The assurance report itself, with its scope section showing the AI component in scope.
  - failure_mode: F4
    text: A sub-processor list with assessment status.
  - failure_mode: F5
    text: A routing record showing a provider notification reaching and being actioned by the control
      owner.
  - failure_mode: F6
    text: A version-pinning or change-notification clause and evidence of it operating.
  population_and_evidence_floor: 'Population: all AI-relevant third parties and AI-embedded products in
    use during the period, from procurement or vendor-management data. Evidence floor: a vendor list supplied
    by the assessed team without procurement reconciliation makes the completeness result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
