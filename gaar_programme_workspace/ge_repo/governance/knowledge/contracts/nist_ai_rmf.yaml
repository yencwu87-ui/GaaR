    locator: controls.MEASURE 1.1.elements[1]
  - id: e3
    text: The organisation should identify testing procedures and metrics to demonstrate AI system trustworthiness
    scope: model
    applies_when: null
    locator: controls.MEASURE 1.1.elements[2]
  boundary:
    none: no register, or a register with no unique identifier and no ownership.
    partial: a register exists and is structurally adequate, but completeness has not been reconciled
      against an independent source, or material staleness is present.
    full: the register is complete against an independent reconciliation, unique, owned and current, and
      sampled records trace to deployed reality.
  owner: Indep. Validation / InfoSec
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 2
  test_of_design:
  - id: D1
    text: Obtain the register or inventory specification for Approaches and metrics for measurement of
      AI risks enumerated during the MAP function are selected for implementation starting with the most
      significant AI risks. Risks or trustworthiness characteristics that cannot be measured are properly
      documented — its required fields, unique identifier, ownership field, lifecycle status and retirement
      rule.
  - id: D2
    text: Confirm the specification defines what triggers a record being created, and at what point relative
      to first use, so completeness has a testable meaning.
  - id: D3
    text: Confirm the authoritative source and the reconciliation route used to prove the register is
      complete against the real estate.
  - id: D4
    text: Confirm update and attestation cadence, and who is accountable for accuracy.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold. PARTIALLY ADEQUATE when fields and ownership are
      defined but no completeness route exists. INADEQUATE when there is no unique identifier or no owner
      field. NOT TESTABLE when the specification is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the full register extract as at a stated date, with a record count.
  - id: O2
    text: 'Test completeness in the direction that can fail: reconcile from the independent source outward
      to the register, not register to itself. Use a deployment source, an access source or a cost or
      telemetry source.'
  - id: O3
    text: 'Test uniqueness and currency: duplicates, records with no owner, records whose status has not
      changed since creation, retired entries still active downstream.'
  - id: O4
    text: Sample records and trace each to real evidence of the thing it claims to describe.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when reconciliation finds no unregistered items and sampled records
      are accurate and current. PARTIALLY EFFECTIVE when the register is broadly accurate but stale or
      incomplete in places. INEFFECTIVE when unregistered production items are found. NOT TESTABLE when
      no independent source is available to reconcile against.'
  near_miss_failure_modes:
  - F1. Completeness is tested register-to-register — the register is reconciled to a list derived from
    itself, which can never find an omission.
  - F2. Every record was created on the same date, indicating a one-off population exercise rather than
    an operating process.
  - F3. Owner fields hold a team mailbox or a departed individual.
  - F4. Retired records remain in an active state downstream — decommissioned in the register but still
    holding credentials or serving traffic.
  - F5. The register captures models but not the prompts, tools or agents that change behaviour without
    a model change.
  resolutions:
  - failure_mode: F1
    text: A reconciliation from an independent source — deployment pipeline, identity provider, cost report
      or runtime telemetry — with exceptions listed.
  - failure_mode: F2
    text: Evidence of incremental record creation over the period, or an approved backfill with a completeness
      statement.
  - failure_mode: F3
    text: An ownership attestation naming current individuals, dated within the cadence.
  - failure_mode: F4
    text: A decommissioning record showing downstream revocation, not only the register status change.
  - failure_mode: F5
    text: A field set covering the components that can change behaviour, with at least one example populated.
  population_and_evidence_floor: 'Population: the full register extract plus the independent reconciliation
    source. Evidence floor: no independent source, or a register extract with no as-at date or record
    count, makes the completeness result NOT TESTABLE rather than PASS.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: MEASURE 1.2
  title: Appropriateness of AI metrics and effectiveness of existing controls are regularly assessed and
    updated, including reports of errors and potential impacts on affected communities.
  requirement: MEASURE 1.2
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should assess external validity of all measurements (e.g., the degree to which
      measurements taken in one context can generalize to other contexts).
    scope: model
    applies_when: null
    locator: controls.MEASURE 1.2.elements[0]
  - id: e2
    text: The organisation should assess effectiveness of existing metrics and controls on a regular basis
      throughout the AI system lifecycle.
    scope: model
    applies_when: null
    locator: controls.MEASURE 1.2.elements[1]
  - id: e3
    text: The organisation should document reports of errors, incidents and negative impacts and assess
      sufficiency and efficacy of existing metrics for repairs, and upgrades
    scope: model
    applies_when: null
    locator: controls.MEASURE 1.2.elements[2]
  boundary:
    none: no methodology, or assessments performed with no criteria.
    partial: a methodology exists and is used, but timing, independence, threshold discipline or reassessment
      is not evidenced.
    full: assessments are complete, timely, independent of the requester, reperformable from the recorded
      facts, and drive the controls their outcome obliges.
  owner: Indep. Validation / InfoSec
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 8
  test_of_design:
  - id: D1
    text: Obtain the approved methodology and template for Appropriateness of AI metrics and effectiveness
      of existing controls are regularly assessed and updated, including reports of errors and potential
      impacts on affected communities — trigger, criteria, scoring or classification scheme, and the decision
      each outcome drives.
  - id: D2
    text: 'Confirm the criteria are discriminating: different inputs produce different outcomes, and the
      thresholds between tiers are stated numerically or by defined rule rather than by judgement alone.'
  - id: D3
    text: Confirm the assessment must be completed before the decision it informs, and who approves the
      outcome.
  - id: D4
    text: Confirm reassessment triggers — material change, incident, elapsed time — and who is accountable
      for detecting them.
  - id: D5
    text: 'Confirm what an outcome obliges: which controls a tier turns on, so classification is load-bearing
      rather than descriptive.'
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the method exists
      but thresholds or consequences are undefined. INADEQUATE when outcomes drive nothing. NOT TESTABLE
      when the approved methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all use cases requiring an assessment in the period, taken from the
      inventory or intake log.'
  - id: O2
    text: Sample across tiers, including at least one that was classified into the lowest tier — the classification
      most likely to be wrong and least likely to be challenged.
  - id: O3
    text: Reperform the classification from the underlying facts and compare to the recorded outcome.
      A reperformance that disagrees is a finding regardless of the approver's seniority.
  - id: O4
    text: 'Verify timing: the assessment date precedes the decision date. Verify reassessment where a
      trigger occurred.'
  - id: s5
    text: 'Operating verdict: EFFECTIVE when reperformance agrees, timing holds and triggers were acted
      on. PARTIALLY EFFECTIVE when assessments are complete but late, or a low-tier outcome cannot be
      supported. INEFFECTIVE when assessments are missing for material use or systematically under-tier.
      NOT TESTABLE when the population of in-scope use cases cannot be established.'
  near_miss_failure_modes:
  - F1. Every use case lands in the same tier, which means the scheme is not discriminating or is being
    applied to reach a pre-decided answer.
  - F2. The assessment is dated after the go-live date, so it documented a decision rather than informing
    it.
  - F3. The assessor and the requester are the same person or the same team.
  - F4. A low-tier classification rests on a scope statement that excludes the risky part of the system
    — for example classifying a copilot as advisory while it writes to a system of record.
  - F5. Reassessment triggers exist on paper but no reassessment occurred despite a material model or
    vendor change in the period.
  resolutions:
  - failure_mode: F1
    text: A tier distribution across the population, with the rationale for outliers in either direction.
  - failure_mode: F2
    text: An assessment record dated before the approval or go-live date, or a documented retrospective
      acceptance.
  - failure_mode: F3
    text: An approval by a role outside the delivery team, named in the record.
  - failure_mode: F4
    text: A scope statement that enumerates the system's write paths and downstream effects, reassessed
      on that basis.
  - failure_mode: F5
    text: A reassessment record tied to the change that triggered it.
  population_and_evidence_floor: 'Population: all use cases requiring assessment in the period, from the
    intake log or AI inventory. Evidence floor: fewer than 3 assessments, or no sample from the lowest
    tier, makes the operating result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
