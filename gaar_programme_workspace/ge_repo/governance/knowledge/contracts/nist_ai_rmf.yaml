- framework: NIST AI RMF
  control_id: GOVERN 6.1
  title: Policies and procedures are in place that address AI risks associated with third-party entities,
    including risks of infringement of a third party's intellectual property or other rights.
  requirement: GOVERN 6.1
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should collaboratively establish policies that address third-party AI systems
      and data.
    scope: model
    applies_when: null
    locator: controls.GOVERN 6.1.elements[0]
  - id: e2
    text: 'The organisation should establish policies related to:'
    scope: model
    applies_when: null
    locator: controls.GOVERN 6.1.elements[1]
  - id: e3
    text: The organisation should transparency into third-party system functions, including knowledge
      about training data, training and inference algorithms, and assumptions and limitations.
    scope: model
    applies_when: null
    locator: controls.GOVERN 6.1.elements[2]
  boundary:
    none: no third-party assessment for AI providers, or providers in production with no assessment.
    partial: onboarding diligence occurred but contractual rights, sub-processor scope or ongoing oversight
      is not evidenced.
    full: assessments preceded use, required clauses are present in executed contracts, and ongoing oversight
      operated with findings dispositioned.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 7
  test_of_design:
  - id: D1
    text: Obtain the third-party requirements covering Policies and procedures are in place that address
      AI risks associated with third-party entities, including risks of infringement of a third party's
      intellectual property or other rights — the due-diligence scope, the contractual clauses required
      and the approval route before onboarding.
  - id: D2
    text: Confirm the due diligence covers what the provider does with the institution's data, the provider's
      own model change practice, and its notification obligations on material change or incident.
  - id: D3
    text: 'Confirm contractual rights: audit or assurance report access, notification periods, exit and
      transition, and liability for model behaviour.'
  - id: D4
    text: Confirm the ongoing obligation — reassessment cadence, performance monitoring and the trigger
      for re-approval.
  - id: D5
    text: Confirm the treatment of sub-processors and of models embedded in a purchased product, where
      the AI is not the thing being bought.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when diligence is defined but
      ongoing obligations or embedded-AI treatment is absent. INADEQUATE when no pre-onboarding assessment
      is required. NOT TESTABLE when the requirements are not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of AI-relevant third parties in the period from procurement or vendor-management
      data, including products with embedded AI, not only AI vendors.
  - id: O2
    text: Sample and verify a completed assessment dated before contract signature or before first production
      use.
  - id: O3
    text: Verify the required clauses are present in the executed contract, read from the contract rather
      than the checklist.
  - id: O4
    text: Verify ongoing obligations operated — reassessment at cadence, assurance reports obtained and
      reviewed with findings dispositioned, and provider change notifications acted on.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when assessments preceded use, clauses are present and ongoing
      obligations ran. PARTIALLY EFFECTIVE when onboarding was controlled but ongoing oversight is unevidenced.
      INEFFECTIVE when material providers were onboarded unassessed. NOT TESTABLE when the vendor population
      cannot be established.'
  near_miss_failure_modes:
  - F1. The provider was assessed as a software vendor before the AI feature was enabled, and never reassessed
    when it was.
  - F2. The assessment is dated after contract signature, so it recorded a decision already taken.
  - F3. The contract references an assurance report that was never obtained, or one that excludes the
    AI component from scope.
  - F4. Sub-processors are named in the provider's terms but were never assessed.
  - F5. Provider change notifications arrive but there is no route by which they reach the control owner.
  - F6. The provider's own model changes silently under a continuously updated service, with no version
    pinning and no notification right.
  resolutions:
  - failure_mode: F1
    text: A reassessment triggered by the AI feature being enabled.
  - failure_mode: F2
    text: An assessment record dated before signature, or an approved exception.
  - failure_mode: F3
    text: The assurance report itself, with its scope section showing the AI component in scope.
  - failure_mode: F4
    text: A sub-processor list with assessment status.
  - failure_mode: F5
    text: A routing record showing a provider notification reaching and being actioned by the control
      owner.
  - failure_mode: F6
    text: A version-pinning or change-notification clause and evidence of it operating.
  population_and_evidence_floor: 'Population: all AI-relevant third parties and AI-embedded products in
    use during the period, from procurement or vendor-management data. Evidence floor: a vendor list supplied
    by the assessed team without procurement reconciliation makes the completeness result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: GOVERN 6.2
  title: Contingency processes are in place to handle failures or incidents in third-party data or AI
    systems deemed to be high-risk.
  requirement: GOVERN 6.2
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should establish policies for handling third-party system failures to include
      consideration of redundancy mechanisms for vital third-party AI systems.
    scope: model
    applies_when: null
    locator: controls.GOVERN 6.2.elements[0]
  - id: e2
    text: The organisation should verify that incident response plans address third-party AI systems.
    scope: model
    applies_when: null
    locator: controls.GOVERN 6.2.elements[1]
  boundary:
    none: no AI incident procedure, or no trigger and no containment path.
    partial: the procedure exists and events were handled, but timings, containment effectiveness or lessons-to-controls
      are not evidenced.
    full: incidents were detected and escalated within target, containment demonstrably took effect, and
      post-incident actions changed the controls they implicate.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 7
  test_of_design:
  - id: D1
    text: Obtain the incident or escalation procedure covering Contingency processes are in place to handle
      failures or incidents in third-party data or AI systems deemed to be high-risk — what constitutes
      an AI incident, severity criteria, and the trigger for invoking it.
  - id: D2
    text: Confirm AI-specific incident types are named, not only availability and security — for example
      harmful output, mandate breach, unexpected autonomous action, drift beyond tolerance.
  - id: D3
    text: Confirm roles, notification paths, timeframes per severity and the authority to contain or halt.
  - id: D4
    text: Confirm the containment mechanism is specified and testable, including who may invoke it and
      how quickly it takes effect.
  - id: D5
    text: Confirm post-incident review, root cause and the route by which lessons change a control.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when the procedure is generic
      and does not name AI failure types, or containment authority is unclear. INADEQUATE when no trigger
      or severity scheme exists. NOT TESTABLE when the procedure is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of incidents and near misses in the period from the incident system, and
      cross-check against monitoring alerts and complaint or override records for events that were never
      raised as incidents.
  - id: O2
    text: Sample incidents and verify detection-to-notification and notification-to-containment times
      against the stated targets.
  - id: O3
    text: Verify containment was invoked by an authorised role and took effect, with evidence from the
      system rather than the ticket.
  - id: O4
    text: Trace post-incident actions to closure and to any control change they required.
  - id: O5
    text: Where no incident occurred, test the mechanism — an exercise, a tabletop with evidence, or a
      controlled invocation in a non-production environment.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when incidents were detected, escalated within target and contained,
      with lessons carried into controls. PARTIALLY EFFECTIVE when handling occurred but timings or closure
      are unevidenced. INEFFECTIVE when events were not raised or containment failed. NOT TESTABLE when
      no incident and no exercise occurred in the period.'
  near_miss_failure_modes:
  - F1. Zero AI incidents in the period is presented as strength, with no near-miss capture and no exercise
    to show the process would engage.
  - F2. Events appear in the monitoring or complaint records but were never raised as incidents, so the
    population is understated.
  - F3. The kill switch is documented but has never been invoked, and no one can state how long it takes
    to take effect.
  - F4. Severity was assigned after resolution, and always at a level that avoided external notification.
  - F5. Post-incident actions are closed as 'awareness raised' with no control change.
  - F6. Containment is evidenced by a ticket status rather than by system evidence that the agent stopped
    acting.
  resolutions:
  - failure_mode: F1
    text: A near-miss register, or an exercise report with date, participants and observed timings.
  - failure_mode: F2
    text: A reconciliation from alerts and complaints to incidents, with any unraised events explained.
  - failure_mode: F3
    text: A containment test with a measured time to effect.
  - failure_mode: F4
    text: A severity assignment dated at detection, with the criteria applied.
  - failure_mode: F5
    text: A post-incident action that amended a control, with the amended control identified.
  - failure_mode: F6
    text: System evidence of containment — revoked credentials, disabled route, halted queue.
  population_and_evidence_floor: 'Population: all incidents and near misses in the period, cross-checked
    against alerts, overrides and complaints. Evidence floor: zero incidents and no exercise means the
    mechanism is untested — report NOT TESTABLE rather than PASS.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
