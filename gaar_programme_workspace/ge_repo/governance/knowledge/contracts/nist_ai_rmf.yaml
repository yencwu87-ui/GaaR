- framework: NIST AI RMF
  control_id: MAP 1.6
  title: System requirements (e.g., the system shall respect the privacy of its users) are elicited from
    and understood by relevant AI actors. Design decisions take socio-technical implications into account
    to address AI risks.
  requirement: MAP 1.6
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should proactively incorporate trustworthy characteristics into system requirements.
    scope: model
    applies_when: null
    locator: controls.MAP 1.6.elements[0]
  - id: e2
    text: The organisation should establish mechanisms for regular communication and feedback between
      relevant AI actors and internal or external stakeholders related to system design or deployment
      decisions.
    scope: model
    applies_when: null
    locator: controls.MAP 1.6.elements[1]
  - id: e3
    text: The organisation should develop and standardize practices to assess potential impacts at all
      stages of the AI lifecycle, and in collaboration with interdisciplinary experts, actors external
      to the team that developed or deployed the AI system, and potentially impacted communities .
    scope: model
    applies_when: null
    locator: controls.MAP 1.6.elements[2]
  boundary:
    none: no identified sources, or sources in use with no permitted-use basis.
    partial: sources are identified and approved but quality measurement, deletion propagation or lineage
      versioning is not evidenced.
    full: every live source is approved with a permitted-use basis, quality is measured against thresholds,
      deletion propagates to derived stores and lineage is version-specific.
  owner: Model Owner + AI Risk
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play: []
  test_of_design:
  - id: D1
    text: Obtain the data requirement covering System requirements (e.g., the system shall respect the
      privacy of its users) are elicited from and understood by relevant AI actors. Design decisions take
      socio-technical implications into account to address AI risks — which datasets are in scope, the
      quality attributes required and the lineage that must be recorded.
  - id: D2
    text: Confirm the permitted-use basis for each source is established, including personal data, licensed
      data and data whose terms restrict model training.
  - id: D3
    text: Confirm quality criteria are measurable and have thresholds, rather than aspirational adjectives.
  - id: D4
    text: Confirm retention, deletion and the handling of data-subject or contractual deletion requests
      where a model or index has already absorbed the data.
  - id: D5
    text: Confirm who approves a new data source into the system.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when quality criteria exist without
      thresholds, or deletion in the model or index is unaddressed. INADEQUATE when permitted use is undefined.
      NOT TESTABLE when the requirement is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of data sources feeding the system in the period, taken from the pipeline
      or retrieval configuration rather than from documentation.
  - id: O2
    text: Verify each source has a recorded permitted-use basis and an approval.
  - id: O3
    text: Sample and test the quality attributes against their thresholds, using the retained measurement
      rather than a statement.
  - id: O4
    text: Trace a deletion or correction request through to the model, index or cache that holds it.
  - id: O5
    text: Verify lineage is sufficient to say which data version produced a given behaviour.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when every live source is approved with a permitted-use basis,
      quality is measured against thresholds and deletion propagates. PARTIALLY EFFECTIVE when sources
      are governed but measurement or propagation is unevidenced. INEFFECTIVE when unapproved sources
      are live. NOT TESTABLE when the source population cannot be established from the pipeline.'
  near_miss_failure_modes:
  - F1. The documented source list and the retrieval configuration disagree, and only the document was
    assessed.
  - F2. Permitted use was assessed for analytics and not for model training or retrieval, which are different
    bases.
  - F3. Quality is described as 'reviewed for accuracy' with no measurement and no threshold.
  - F4. Deletion is honoured in the source system while the vector index or cache retains the content.
  - F5. A new source was added by a configuration change that never entered the data governance route.
  - F6. Lineage stops at the dataset name, with no version or snapshot date.
  resolutions:
  - failure_mode: F1
    text: A pipeline or retrieval configuration export reconciled to the documented source list.
  - failure_mode: F2
    text: A permitted-use assessment naming the specific processing purpose.
  - failure_mode: F3
    text: A measured quality result against a stated threshold.
  - failure_mode: F4
    text: Evidence of deletion propagating to the index or cache, with a re-query showing absence.
  - failure_mode: F5
    text: An approval record for the source addition, tied to the configuration change.
  - failure_mode: F6
    text: A lineage record carrying dataset version or snapshot date.
  population_and_evidence_floor: 'Population: all data sources feeding the system in the period, from
    pipeline or retrieval configuration. Evidence floor: a source list taken from documentation rather
    than the pipeline cannot establish completeness — report NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: MAP 2.1
  title: The specific tasks and methods used to implement the tasks that the AI system will support are
    defined (e.g., classifiers, generative models, recommenders).
  requirement: MAP 2.1
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The AI system's existing and potential learning task(s) are defined and documented, together
      with known assumptions and limitations.
    scope: model
    applies_when: null
    locator: controls.MAP 2.1.elements[0]
  boundary:
    none: no methodology, or assessments performed with no criteria.
    partial: a methodology exists and is used, but timing, independence, threshold discipline or reassessment
      is not evidenced.
    full: assessments are complete, timely, independent of the requester, reperformable from the recorded
      facts, and drive the controls their outcome obliges.
  owner: Model Owner + AI Risk
  expected_evidence:
  - NIST AI RMF Playbook control statement
  linked_play: []
  test_of_design:
  - id: D1
    text: Obtain the approved methodology and template for The specific tasks and methods used to implement
      the tasks that the AI system will support are defined (e.g., classifiers, generative models, recommenders)
      — trigger, criteria, scoring or classification scheme, and the decision each outcome drives.
  - id: D2
    text: 'Confirm the criteria are discriminating: different inputs produce different outcomes, and the
      thresholds between tiers are stated numerically or by defined rule rather than by judgement alone.'
  - id: D3
    text: Confirm the assessment must be completed before the decision it informs, and who approves the
      outcome.
  - id: D4
    text: Confirm reassessment triggers — material change, incident, elapsed time — and who is accountable
      for detecting them.
  - id: D5
    text: 'Confirm what an outcome obliges: which controls a tier turns on, so classification is load-bearing
      rather than descriptive.'
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the method exists
      but thresholds or consequences are undefined. INADEQUATE when outcomes drive nothing. NOT TESTABLE
      when the approved methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all use cases requiring an assessment in the period, taken from the
      inventory or intake log.'
  - id: O2
    text: Sample across tiers, including at least one that was classified into the lowest tier — the classification
      most likely to be wrong and least likely to be challenged.
  - id: O3
    text: Reperform the classification from the underlying facts and compare to the recorded outcome.
      A reperformance that disagrees is a finding regardless of the approver's seniority.
  - id: O4
    text: 'Verify timing: the assessment date precedes the decision date. Verify reassessment where a
      trigger occurred.'
  - id: s5
    text: 'Operating verdict: EFFECTIVE when reperformance agrees, timing holds and triggers were acted
      on. PARTIALLY EFFECTIVE when assessments are complete but late, or a low-tier outcome cannot be
      supported. INEFFECTIVE when assessments are missing for material use or systematically under-tier.
      NOT TESTABLE when the population of in-scope use cases cannot be established.'
  near_miss_failure_modes:
  - F1. Every use case lands in the same tier, which means the scheme is not discriminating or is being
    applied to reach a pre-decided answer.
  - F2. The assessment is dated after the go-live date, so it documented a decision rather than informing
    it.
  - F3. The assessor and the requester are the same person or the same team.
  - F4. A low-tier classification rests on a scope statement that excludes the risky part of the system
    — for example classifying a copilot as advisory while it writes to a system of record.
  - F5. Reassessment triggers exist on paper but no reassessment occurred despite a material model or
    vendor change in the period.
  resolutions:
  - failure_mode: F1
    text: A tier distribution across the population, with the rationale for outliers in either direction.
  - failure_mode: F2
    text: An assessment record dated before the approval or go-live date, or a documented retrospective
      acceptance.
  - failure_mode: F3
    text: An approval by a role outside the delivery team, named in the record.
  - failure_mode: F4
    text: A scope statement that enumerates the system's write paths and downstream effects, reassessed
      on that basis.
  - failure_mode: F5
    text: A reassessment record tied to the change that triggered it.
  population_and_evidence_floor: 'Population: all use cases requiring assessment in the period, from the
    intake log or AI inventory. Evidence floor: fewer than 3 assessments, or no sample from the lowest
    tier, makes the operating result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: MAP 2.2
  title: Information about the AI system's knowledge limits and how system output may be utilized and
    overseen by humans is documented.
  requirement: MAP 2.2
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should document settings, environments and conditions that are outside the
      AI system's intended use.
    scope: model
    applies_when: null
    locator: controls.MAP 2.2.elements[0]
  - id: e2
    text: The organisation should design for end user workflows and toolsets, concept of operations, and
      explainability and interpretability criteria in conjunction with end user(s) and associated qualitative
      feedback.
    scope: model
    applies_when: null
    locator: controls.MAP 2.2.elements[1]
  - id: e3
    text: The organisation should plan and test human-AI configurations under close to real-world conditions
      and document results.
    scope: model
    applies_when: null
    locator: controls.MAP 2.2.elements[2]
  boundary:
    none: no defined boundary, or authority granted with no approval.
    partial: the boundary is defined and approved but enforcement, override discipline or recertification
      is not evidenced.
    full: the enforced boundary matches the approved boundary, overrides are independently approved with
      reasons, and recertification demonstrably revokes.
  owner: Model Owner + AI Risk
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play: []
  test_of_design:
  - id: D1
    text: Obtain the definition of the authority boundary for Information about the AI system's knowledge
      limits and how system output may be utilized and overseen by humans is documented — permitted actions,
      counterparties, value or exposure limits, data scope and the systems it may write to.
  - id: D2
    text: Confirm the boundary is expressed where it is enforced, not only in a document — a configuration,
      a policy object or a runtime guardrail.
  - id: D3
    text: Confirm who grants and who approves a change to the boundary, and that the two are separated
      from the requester.
  - id: D4
    text: 'Confirm what happens at the boundary: hard block, human referral or log-and-continue, and that
      the choice is approved.'
  - id: D5
    text: Confirm periodic recertification of granted authority, with a defined cadence and an accountable
      reviewer.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when limits are documented but
      not enforced, or recertification is absent. INADEQUATE when no boundary is defined. NOT TESTABLE
      when the authoritative definition is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the enforced configuration as at a date and compare it, field by field, to the approved
      boundary.
  - id: O2
    text: Define the population of granted access or mandate holders, and reconcile it to the approved
      grants — in the direction of finding grants nobody approved.
  - id: O3
    text: 'Sample boundary events in the period: blocks, referrals and overrides. Trace each override
      to an approver with authority and a recorded reason.'
  - id: O4
    text: Where no boundary event occurred, test the enforcement — a controlled attempt or an equivalent
      assurance that the limit binds.
  - id: O5
    text: Inspect the most recent recertification for completeness and for revocations actually taking
      effect.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when enforced limits match approved limits, overrides are approved
      and recertification took effect. PARTIALLY EFFECTIVE when the boundary holds but grants are stale
      or overrides are unevidenced. INEFFECTIVE when unapproved authority is found in production. NOT
      TESTABLE when the enforced configuration cannot be obtained.'
  near_miss_failure_modes:
  - F1. The limit is in a policy document and nowhere in the running system, so nothing stops the action.
  - F2. The enforced value is more permissive than the approved value, changed by a ticket that never
    reached the approver.
  - F3. Overrides are recorded but the approver is the same identity that requested the action.
  - F4. Recertification was completed as an attestation with no revocations, across a population where
    joiners and leavers certainly occurred.
  - F5. The agent holds standing credentials broader than its mandate because the mandate is enforced
    at the orchestration layer and the credential is not.
  - F6. Limits bind per transaction but not in aggregate, so the boundary is passable by repetition.
  resolutions:
  - failure_mode: F1
    text: An export of the enforced configuration or policy object showing the limit in force.
  - failure_mode: F2
    text: A reconciliation of enforced versus approved values with any deviation approved retrospectively.
  - failure_mode: F3
    text: An override record naming a distinct approver and the reason.
  - failure_mode: F4
    text: A recertification with revocation evidence at the target system, not only the sign-off sheet.
  - failure_mode: F5
    text: An entitlement review of the credential itself, scoped to the mandate.
  - failure_mode: F6
    text: An aggregate or cumulative limit in the enforced configuration, with evidence of its operation.
  population_and_evidence_floor: 'Population: the enforced configuration plus all grants and all boundary
    events in the period. Evidence floor: no enforced configuration export, or zero boundary events with
    no enforcement test, makes the operating result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
