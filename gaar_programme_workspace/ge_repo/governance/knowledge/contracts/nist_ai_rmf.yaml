- framework: NIST AI RMF
  control_id: MANAGE 4.1
  title: Post-deployment AI system monitoring plans are implemented, including mechanisms for capturing
    and evaluating input from users and other relevant AI actors, appeal and override, decommissioning,
    incident response, recovery, and change management.
  requirement: MANAGE 4.1
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should establish and maintain procedures to monitor AI system performance for
      risks and negative and positive impacts associated with trustworthiness characteristics.
    scope: model
    applies_when: null
    locator: controls.MANAGE 4.1.elements[0]
  - id: e2
    text: The organisation should perform post-deployment TEVV tasks to evaluate AI system validity and
      reliability, bias and fairness, privacy, and security and resilience.
    scope: model
    applies_when: null
    locator: controls.MANAGE 4.1.elements[1]
  - id: e3
    text: The organisation should evaluate AI system trustworthiness in conditions similar to deployment
      context of use, and prior to deployment.
    scope: model
    applies_when: null
    locator: controls.MANAGE 4.1.elements[2]
  boundary:
    none: no AI incident procedure, or no trigger and no containment path.
    partial: the procedure exists and events were handled, but timings, containment effectiveness or lessons-to-controls
      are not evidenced.
    full: incidents were detected and escalated within target, containment demonstrably took effect, and
      post-incident actions changed the controls they implicate.
  owner: Model Owner + AI Risk
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 5
  test_of_design:
  - id: D1
    text: Obtain the incident or escalation procedure covering Post-deployment AI system monitoring plans
      are implemented, including mechanisms for capturing and evaluating input from users and other relevant
      AI actors, appeal and override, decommissioning, incident response, recovery, and change management
      — what constitutes an AI incident, severity criteria, and the trigger for invoking it.
  - id: D2
    text: Confirm AI-specific incident types are named, not only availability and security — for example
      harmful output, mandate breach, unexpected autonomous action, drift beyond tolerance.
  - id: D3
    text: Confirm roles, notification paths, timeframes per severity and the authority to contain or halt.
  - id: D4
    text: Confirm the containment mechanism is specified and testable, including who may invoke it and
      how quickly it takes effect.
  - id: D5
    text: Confirm post-incident review, root cause and the route by which lessons change a control.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when the procedure is generic
      and does not name AI failure types, or containment authority is unclear. INADEQUATE when no trigger
      or severity scheme exists. NOT TESTABLE when the procedure is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of incidents and near misses in the period from the incident system, and
      cross-check against monitoring alerts and complaint or override records for events that were never
      raised as incidents.
  - id: O2
    text: Sample incidents and verify detection-to-notification and notification-to-containment times
      against the stated targets.
  - id: O3
    text: Verify containment was invoked by an authorised role and took effect, with evidence from the
      system rather than the ticket.
  - id: O4
    text: Trace post-incident actions to closure and to any control change they required.
  - id: O5
    text: Where no incident occurred, test the mechanism — an exercise, a tabletop with evidence, or a
      controlled invocation in a non-production environment.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when incidents were detected, escalated within target and contained,
      with lessons carried into controls. PARTIALLY EFFECTIVE when handling occurred but timings or closure
      are unevidenced. INEFFECTIVE when events were not raised or containment failed. NOT TESTABLE when
      no incident and no exercise occurred in the period.'
  near_miss_failure_modes:
  - F1. Zero AI incidents in the period is presented as strength, with no near-miss capture and no exercise
    to show the process would engage.
  - F2. Events appear in the monitoring or complaint records but were never raised as incidents, so the
    population is understated.
  - F3. The kill switch is documented but has never been invoked, and no one can state how long it takes
    to take effect.
  - F4. Severity was assigned after resolution, and always at a level that avoided external notification.
  - F5. Post-incident actions are closed as 'awareness raised' with no control change.
  - F6. Containment is evidenced by a ticket status rather than by system evidence that the agent stopped
    acting.
  resolutions:
  - failure_mode: F1
    text: A near-miss register, or an exercise report with date, participants and observed timings.
  - failure_mode: F2
    text: A reconciliation from alerts and complaints to incidents, with any unraised events explained.
  - failure_mode: F3
    text: A containment test with a measured time to effect.
  - failure_mode: F4
    text: A severity assignment dated at detection, with the criteria applied.
  - failure_mode: F5
    text: A post-incident action that amended a control, with the amended control identified.
  - failure_mode: F6
    text: System evidence of containment — revoked credentials, disabled route, halted queue.
  population_and_evidence_floor: 'Population: all incidents and near misses in the period, cross-checked
    against alerts, overrides and complaints. Evidence floor: zero incidents and no exercise means the
    mechanism is untested — report NOT TESTABLE rather than PASS.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
- framework: NIST AI RMF
  control_id: MANAGE 4.2
  title: Measurable activities for continual improvements are integrated into AI system updates and include
    regular engagement with interested parties, including relevant AI actors.
  requirement: MANAGE 4.2
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should integrate trustworthiness characteristics into protocols and metrics
      used for continual improvement.
    scope: model
    applies_when: null
    locator: controls.MANAGE 4.2.elements[0]
  - id: e2
    text: The organisation should establish processes for evaluating and integrating feedback into AI
      system improvements.
    scope: model
    applies_when: null
    locator: controls.MANAGE 4.2.elements[1]
  - id: e3
    text: The organisation should assess and evaluate alignment of proposed improvements with relevant
      regulatory and legal frameworks
    scope: model
    applies_when: null
    locator: controls.MANAGE 4.2.elements[2]
  boundary:
    none: no approved definition, or no evidence the control operated.
    partial: the control is defined and operated but population completeness, timing or reperformance
      is not evidenced.
    full: the control is defined, operated at frequency over a completely established population, and
      reperformance agrees with the recorded outcomes.
  owner: Model Owner + AI Risk
  expected_evidence:
  - NIST AI RMF Playbook suggested action
  linked_play:
  - Play 8
  test_of_design:
  - id: D1
    text: Obtain the approved artefact that defines Measurable activities for continual improvements are
      integrated into AI system updates and include regular engagement with interested parties, including
      relevant AI actors — procedure, standard, configuration or specification — with its owner, approval
      and version.
  - id: D2
    text: Confirm it states what must happen, who must do it, when it is triggered and what output it
      produces, in terms specific enough that two assessors would test it the same way.
  - id: D3
    text: Confirm the evidence the control is expected to generate, and where that evidence is retained.
  - id: D4
    text: Confirm the exception route and the review cycle.
  - id: D5
    text: 'Confirm the design addresses the stated objective rather than restating it: as stated in the
      control text'
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 hold. PARTIALLY ADEQUATE when the control is defined but
      its output evidence or exception route is not. INADEQUATE when the control cannot be tested as written.
      NOT TESTABLE when the approved artefact is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Establish the population the control operates over, from a source independent of the team being
      assessed, and state the record count.
  - id: O2
    text: Sample across the period, weighted to the higher-risk or higher-materiality end.
  - id: O3
    text: Reperform the control step on each sampled item and compare the result to the recorded outcome.
  - id: O4
    text: Verify timing — the control operated before the thing it governs, at the required frequency.
  - id: O5
    text: Trace exceptions and failures to remediation or formal acceptance.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when reperformance agrees, timing holds and exceptions are dispositioned.
      PARTIALLY EFFECTIVE when the control operated with gaps in evidence or timing. INEFFECTIVE when
      material instances were not performed. NOT TESTABLE when the population or the operating records
      are unavailable.'
  near_miss_failure_modes:
  - F1. The evidence describes the control as designed rather than showing an instance of it operating.
  - F2. The population was supplied by the team being assessed, so an omission cannot be detected.
  - F3. Every sampled instance carries the same date, indicating a retrospective exercise.
  - F4. The control output exists but no one acted on it — a report produced and never read.
  - F5. The artefact is approved but its version postdates the period being tested.
  resolutions:
  - failure_mode: F1
    text: A dated instance of the control operating, with its output.
  - failure_mode: F2
    text: A population extracted from an independent system with a record count.
  - failure_mode: F3
    text: Instances distributed across the period consistent with the stated frequency.
  - failure_mode: F4
    text: Evidence of the output being reviewed and acted on, with a named reviewer.
  - failure_mode: F5
    text: The version of the artefact in force during the period.
  population_and_evidence_floor: 'Population: all instances the control should have operated over in the
    period, established independently of the assessed team, with a record count. Evidence floor: fewer
    than 3 sampled instances, or a population supplied without an independent source, makes the operating
    result NOT TESTABLE.'
  test_provenance: 'Audited v0.5.2: requirement elements derived from the source requirement/outcome only.
    ToD/ToE, evidence floors, challenge banks and internet knowledge do not create requirement obligations.'
