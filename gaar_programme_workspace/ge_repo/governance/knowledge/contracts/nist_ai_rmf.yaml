  title: Responses to the AI risks deemed high priority, as identified by the MAP function, are developed,
    planned and documented. Risk response options can include mitigating, transferring, avoiding or accepting.
  requirement: MANAGE 1.3
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The organisation should observe regulatory and established organizational, sector, discipline,
