  - id: D1
    text: Obtain the approved methodology and template for Scientific integrity and TEVV considerations
      are identified and documented, including those related to experimental design, data collection and
      selection (e.g., availability, representativeness, suitability), system trustworthiness, and construct
      validation — trigger, criteria, scoring or classification scheme, and the decision each outcome
      drives.
