capability_observations:
  - capability_id: SDLC.BRANCH_PROTECTION
    provider: github
    resource: branch_protection
    evidence_packets:
      title_template: "GitHub branch protection — {branch}"
      locator_template: "github_api:GET /repos/{owner}/{repo}/branches/{branch}/protection"
      excerpt_fields: [enforce_admins, required_pull_request_reviews, required_approving_review_count, require_code_owner_reviews]

  - capability_id: SDLC.REQUIRED_STATUS_CHECKS
    provider: github
    resource: branch_protection
    excerpt_fields: [required_status_checks]

  - capability_id: SDLC.CODEOWNERS_ENFORCED
    provider: github
    resource: codeowners
    excerpt_fields: [codeowners_present, codeowners_paths_count]
