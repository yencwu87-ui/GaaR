      outcomes: [OVS-INVENTORY-01]
      capabilities: [DISC.MODEL_REGISTRY_PRESENT, DISC.OWNERSHIP_DEFINED, DISC.DEPENDENCIES_RECORDED]
    lane: a
    evidence_modes: [document, record, plugin_observation]

