schema: v0.9.crosswalk.1
version: 0.1.0
notes:
  - "Curated governance mappings; they are not claims of regulatory equivalence."
  - "Map at atomic element level where the repository provides audited elements."
  - "capability_id is the stable internal semantic anchor; outcomes aggregate via capabilities."
  - "Lane A uses evidence sufficiency. Lane B may later attach deterministic checks to capability_id."
  - "MGF namespace is D1.x through D4.x from the governed MGF Agentic workbook."

mappings:
