# Regulatory watch catalogue (kit v21): sources you can subscribe to, in addition to the official
# publication indexes in official_publication_indexes.yaml. Subscribing is done in the watch home
# (subscriptions.yaml), not here. A source's page structure is only proven by its first successful
# scan on your network: until then it reads NEVER_CHECKED, and a failed scan is UNABLE_TO_CHECK,
# never "no updates".
indexes:
  - source_id: mas-guidelines-index
    jurisdiction: Singapore
    authority: MAS
    url: https://www.mas.gov.sg/regulation/guidelines
    approved_hosts: [www.mas.gov.sg]
    path_prefixes: [/regulation/guidelines/]
    max_items: 100
  - source_id: mas-circulars-index
    jurisdiction: Singapore
    authority: MAS
    url: https://www.mas.gov.sg/regulation/circulars
    approved_hosts: [www.mas.gov.sg]
    path_prefixes: [/regulation/circulars/]
    max_items: 100
  # Kit v22 additions. "verified: false" means the address and page structure are from public documentation and have
  # not yet been checked from a machine that can reach them; the first successful scan verifies them.
  - source_id: fed-sr-letters-index
    jurisdiction: US
    authority: Federal Reserve
    url: https://www.federalreserve.gov/supervisionreg/srletters/srletters.htm
    approved_hosts: [www.federalreserve.gov]
    path_prefixes: [/supervisionreg/srletters/]
    max_items: 100
    verified: false
  - source_id: pboc-en-news-index
    jurisdiction: China
    authority: PBOC
    url: https://www.pbc.gov.cn/en/3688110/3688172/index.html
    approved_hosts: [www.pbc.gov.cn]
    path_prefixes: [/en/3688110/3688172/]
    max_items: 100
    verified: false
feeds:
  # Kit v27. HKMA's own RSS feeds, found on its RSS page by the v26 Mac round (200 to both a browser and the watcher;
  # the two index pages guessed earlier returned 404 to both). They sit beside the press feed that already scans.
  # hkma-circulars-index keeps its id so existing subscriptions stay valid; it now reads the circulars feed.
  - source_id: hkma-circulars-index
    jurisdiction: Hong Kong
    authority: HKMA
    format: rss
    url: https://www.hkma.gov.hk/eng/other-information/rss/rss_circulars.xml
    approved_hosts: [www.hkma.gov.hk]
    verified: false
  - source_id: hkma-guidelines-rss
    jurisdiction: Hong Kong
    authority: HKMA
    format: rss
    url: https://www.hkma.gov.hk/eng/other-information/rss/rss_guidelines.xml
    approved_hosts: [www.hkma.gov.hk]
    verified: false
  - source_id: hkma-consultations-rss
    jurisdiction: Hong Kong
    authority: HKMA
    format: rss
    url: https://www.hkma.gov.hk/eng/other-information/rss/rss_consultations.xml
    approved_hosts: [www.hkma.gov.hk]
    verified: false
  - source_id: hkma-spm-rss
    jurisdiction: Hong Kong
    authority: HKMA
    format: rss
    url: https://www.hkma.gov.hk/eng/other-information/rss/rss_supervisory-policy-manual.xml
    approved_hosts: [www.hkma.gov.hk]
    verified: false
  - source_id: fed-press-rss
    jurisdiction: US
    authority: Federal Reserve
    format: rss
    url: https://www.federalreserve.gov/feeds/press_all.xml
    approved_hosts: [www.federalreserve.gov]
    verified: false
  - source_id: sec-press-rss
    jurisdiction: US
    authority: SEC
    format: rss
    url: https://www.sec.gov/news/pressreleases.rss
    approved_hosts: [www.sec.gov]
    verified: false
    note: The SEC refuses anonymous clients; set user_agent in subscriptions.yaml to include a contact email.
  - source_id: nist-news-rss
    jurisdiction: US
    authority: NIST
    format: rss
    url: https://www.nist.gov/news-events/news/rss.xml
    approved_hosts: [www.nist.gov]
    verified: false
  - source_id: boe-news-rss
    jurisdiction: UK
    authority: Bank of England / PRA
    format: rss
    url: https://www.bankofengland.co.uk/rss/news
    approved_hosts: [www.bankofengland.co.uk]
    verified: false
  - source_id: boe-publications-rss
    jurisdiction: UK
    authority: Bank of England / PRA
    format: rss
    url: https://www.bankofengland.co.uk/rss/publications
    approved_hosts: [www.bankofengland.co.uk]
    verified: false
  - source_id: fca-news-rss
    jurisdiction: UK
    authority: FCA
    format: rss
    url: https://www.fca.org.uk/news/rss.xml
    approved_hosts: [www.fca.org.uk]
    verified: false
  - source_id: hkma-press-rss
    jurisdiction: Hong Kong
    authority: HKMA
    format: rss
    url: https://www.hkma.gov.hk/eng/other-information/rss/rss_press-release.xml
    approved_hosts: [www.hkma.gov.hk]
    verified: false
  - source_id: cisa-kev
    jurisdiction: GLOBAL
    authority: CISA
    kind: threat
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    approved_hosts: [www.cisa.gov]
    items_field: vulnerabilities
    id_field: cveID
    title_fields: [cveID, vulnerabilityName]
    date_field: dateAdded
    flag_field: knownRansomwareCampaignUse
    flag_value: Known
# Kit v24: official email alerts, for regulators whose websites refuse automated clients (MAS: challenge page; FCA:
# HTTP 403 on the v22 Mac round). Put alert emails in ~/gaar-watch/mail/<source_id>/ or configure `mail:` (IMAP) in
# subscriptions.yaml. Sender domains and link paths are from public documentation: the first alert verifies them.
mailboxes:
  - source_id: mas-email-alerts
    jurisdiction: Singapore
    authority: MAS
    subscribe_url: https://www.mas.gov.sg/subscription-services
    sender_domains: [mas.gov.sg]
    approved_hosts: [www.mas.gov.sg]
    path_prefixes: [/regulation/, /publications/, /news/]
    redirect_hosts: []
    stale_after_days: 21
    verified: false
  - source_id: fca-email-alerts
    jurisdiction: UK
    authority: FCA
    subscribe_url: https://www.fca.org.uk/news-and-publications-email-alerts
    sender_domains: [fca.org.uk, fcanewsletters.org.uk, govdelivery.com]   # v29: FCA sends from fcanewsletters.org.uk
    approved_hosts: [www.fca.org.uk]
    path_prefixes: [/publications/, /news/]
    redirect_hosts: [links-1.govdelivery.com, links-2.govdelivery.com, lnks.gd]
    stale_after_days: 7
    verified: false
# Kit v24: web-search leads (ollama_search.py, DuckDuckGo, no key). They find pages a search engine has indexed on the
# regulator's own site. Never coverage: items are labelled leads and capped at P2 until a person triages them.
searches:
  - source_id: mas-search-leads
    jurisdiction: Singapore
    authority: MAS
    queries: ["site:mas.gov.sg circular", "site:mas.gov.sg notice", "site:mas.gov.sg consultation paper",
              "site:mas.gov.sg guidelines", "Monetary Authority of Singapore circular", "MAS consultation paper"]
    approved_hosts: [www.mas.gov.sg]
    path_prefixes: [/regulation/, /publications/consultations/, /news/media-releases/]
    max_results: 10
    verified: false
  - source_id: fca-search-leads
    jurisdiction: UK
    authority: FCA
    queries: ["site:fca.org.uk consultation paper", "site:fca.org.uk policy statement",
              "FCA consultation paper", "FCA policy statement"]
    approved_hosts: [www.fca.org.uk]
    path_prefixes: [/publications/]
    max_results: 10
    verified: false
