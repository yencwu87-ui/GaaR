# Result as a Service parameters (kit v31). Governance and commercial parameters, not code constants: changing one is
# a recorded change, and every result pack states the values it ran under (params_sha256).
currency: SGD
prices:
  # Working assumptions for a design-partner conversation, not market-validated.
  control_assured: 1500          # per control, per period, counted only when the period is warranted
  exception_closed: 800          # per exception closed by an independent retest, or under a signed risk acceptance
  regulatory_change: 2000        # per publication whose control set a named person has signed
  vendor_agent_verified: 20000   # per vendor agent, per quarter, paid by the vendor
verification:
  planted_share: 0.5             # share of verification cases that carry a planted defect
  min_planted: 50                # fewer planted defects than this and no false-assurance rate is published
  confidence: 0.95               # the published upper bound on the false-assurance rate
warranty:
  max_far: 0.01                  # eligibility: measured false-assurance rate at or below this
  refund_multiple: 3             # refund per falsely assured control, as a multiple of its fee
  cap_share_of_fee: 0.25         # total refunds capped at this share of the period fee
  claim_window_days: 365
  reserve_share: 0.10            # reserve held against claims, as a share of the period fee
  assumed_defect_prevalence: 0.10  # for the expected-claim estimate only; replaced by observed rates after 4 quarters
risk_acceptance:
  max_days: 365                  # a risk acceptance expires; an expired one is an open exception again
reg_to_control:
  min_shared_terms: 3            # distinctive terms an obligation must share with a control to be read as an amendment
  obligation_markers: ["must", "shall", "should", "is expected to", "are expected to", "is required to",
                       "are required to"]
